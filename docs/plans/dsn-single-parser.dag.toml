status = "fixed"
role = "A SECOND printer of DSN-derived values, outside this map and so outside every round that hardened the first. It named its resolved host in a refusal with no control at all; three shapes printed a whole password, measured at 215ded8. The property is POSITION, not secrecy: a credential position is never named, a target position is named only through the control."
pins = "A corpus planted by position, asserting both halves, plus a case that an ordinary host is still named in full."
affects = ["display.one_control", "gate.third_consumer"]
