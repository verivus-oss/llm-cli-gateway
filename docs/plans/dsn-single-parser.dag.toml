kind = "new_module"
file = "src/storage/pg-dsn-gate.ts"
status = "done"
role = "The single core admission decision, consulted before reporting or connection. It rejects ambiguous URI shapes and returns a verdict, never a rewritten string. The reporter alone applies the stricter SSL-file refusal because parsing those options would perform synchronous file I/O."
pins = "Each rule needs a reason test naming a case no other rule catches, plus a mutation the suite kills. Round 23 found two rules that each passed when disabled alone because they masked each other."
affects = ["parse.single", "connect.db", "connect.migrate", "channel.redirect"]
critical = true

