question = "Does the corpus assert over where the marker was planted, or only over how many DSNs were accepted?"

[[invariant]]
id = "one_printer"
question = "How many places render a DSN-derived value into a line a human reads? One control, whatever the caller's vocabulary."

[[invariant]]
id = "harness_ran"
question = "For a mutation reported killed: did the suite RUN? Name the summary line, never the exit code alone."
