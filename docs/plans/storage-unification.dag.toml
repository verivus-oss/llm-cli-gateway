# One storage choice for every subsystem. Implements docs/plans/storage-unification.md (rev 3, 84c2c2f).
# Evidence: docs/evidence/storage-unification-audit-2026-08-21.md (host-local).

[meta]
surface = "FlightRecorder, JobStore and ISessionManager: 3 interfaces, 2 engines. RECOUNTED 2026-08-21: 53 members, not the 42 this line carried since before s2 split queryRequests into seven named reads. JobStore 26, ISessionManager 13, FlightRecorder 14. s3sig signs 12 recorder operations and excludes 2 by name, which is where its own figure of 48 comes from; both are above 42 and that is the point."
status = "2026-08-21. s1, s2, s3 part 1, s4, b1, s5, s3sig and s8 DONE. s6, s7, s12, s13 unblocked; s9 needs s7; s10 held. s6 and s7 are authored against s3sig's signatures."

# WHY: `[persistence].backend` selects the job store and nothing else, so one
# request's two halves live in two engines 15 ms apart, beside an abandoned
# 31,895-row `jobs` table still answering queries in the recorder's own file.
# 2470e09 made that visible in llm_process_health. This makes it untrue.

[decisions]
# Operator, 2026-08-21. A stopping point not written down reads as an abandonment.
scope_0a = "Option A. b1, s3sig, s5, s6, s8, s9, s11 in full; s7 stops with the recorder on the port under the SQLite driver. Transcript bodies into Postgres and s10 are a separate human-supervised run: a plan-sanctioned stop, not a deferral."
retirement_0b = "Superseded state is proposed per file and may be moved to a quarantine directory so it stops looking live. Nothing is deleted by this run."

[facts]
write_visibility = "TWENTY instances of one class, censused at c518e3f: a call that stopped throwing and started rejecting, inside a try whose catch can therefore no longer fire. ELEVEN lost a control, not a log line, including recordStartOrFailClosed inverting on the path every async job takes, and index.ts:23778 never awaiting jobStore.close() so the bounded drain defeats itself. A SEVENTH mechanism, for every node converting an init path: an await placed where a value is finally USED does not protect the reads on the way there. Three entry points read durableAdmission directly, 37 and 19 lines before their gate and one with no gate, safe only while a sync constructor finished registering before returning. Ask three things: after this returns, what row exists, which guard has quietly stopped guarding, and what reads this value before the await? A FIFTH: the drain bound was Promise.race between a microtask chain and a timer, so the timeout was enforced by a timer the queue starves, measured running 2598 ms past a 2000 ms bound rejecting nothing. A SIXTH mechanism, and lint does NOT catch it: making a method async silently disarms conditions written against the sync one, because `!promise` is always false. Seven such conditions stopped being evaluated, including an ownership guard and two terminal-write guards. NINE in the end, graded one security, four durability, four correctness. Type-aware lint detects the unawaited half only: it misses a promise consumed as a `||` operand entirely, verified as zero messages on the line. c249667 is the detector built for it, a type-checker gate for a promise in boolean position, and it found the ninth."
schema_gap = "`requests` and `gateway_metadata` exist ONLY in SQLite. The Postgres transcript schema is new authorship, not a migration."

[non_goals]
gate_output_is_not_a_control = "A gate reporting `0 production, 8 tests` was read as a clean production number with a tail, by BOTH the track and the controller, for hours. All eight were live defects of the exact class the gate was built to find, including a receipt helper that returned a promise typed as a record and caused 15 downstream failures. Work every gate's output to zero or say why a finding is not one. Output nobody acts on is not a control. Its twin, hit INDEPENDENTLY by the controller and by a track on the same day: `check | tail` returns tail's exit code, so both of us reported a gate green while it was red. Never read an exit code through a pipe."
a_constraint_is_not_a_gate = "s3sig's constraint said PRAGMA and VACUUM must be UNREACHABLE from the surface. Checked at f6048d5: scripts/check-storage-port.mjs contained ZERO mentions of either word, enforced two unrelated rules, and had NO test file. The constraint had been sitting in this map since s3, cited by name, wired to nothing. A constraint written in a plan is an unexecuted assertion until something runs it, and this map has now produced two of them (see also inPort:true on approvals, admin_audit and workspace_registry, which names no implementing node and never did). When you write a constraint, name the gate that enforces it or mark it UNENFORCED."
no_postgres_mandate = "Decided 2026-08-13. SQLite stays as a driver. 'Postgres only' is a deployment property via config, never a package property via removal; the 2.0.0 node:sqlite move exists to keep zero-config npm installs working."
no_transcript_move_yet = "Bodies do NOT enter Postgres until postgres-security-hardening.md section 6 is complete through step 8. It is at step 2 of 10. Moving 1.2 GB of plaintext prompts into a store one superuser role reads in cleartext is a regression over a 0600 file."

[[node]]
id = "b1.sqlite-async-benchmark"
depends_on = []
role = "Design section 9's outstanding deliverable. Until it exists, whether wrapping a synchronous engine in promises costs anything at the recorder's call rate is UNKNOWN, and the design says so."
action = "Measure p50/p99 request latency, event-loop delay, WAL contention and shutdown drain on a representative 1.2 GB copy, at measured and worst-case rates."
constraint = "Never against the live logs.db; use a snapshot. A result that says the overhead matters is a finding that reshapes s7, not a failure."
status = "done 2026-08-21, 5 rounds. Wrapping is not a stable effect (-1.3us, sign-unstable over 3 processes); the stable +17us is the driver's non-async bundle, so s7 proceeds. Buried under 10.8ms fsync/request and an 11ms low-rate cold penalty, not shown independent. Round 5 asked the only question that could have stopped s7, whether the UNNAMED cold penalty interacts with wrapping, and both reviewers independently said no: the paired B-A0 delta does not grow as the machine goes cold (+0.058/+0.202/+0.072ms cold against +0.068/+0.043/+0.020ms warm), which falsifies every interaction hypothesis at once. All four harness asymmetries found across five rounds bias AGAINST async, which is why near-zero survives them. Shutdown is the real async cost: JobStore.close() is `void` so no caller can await a drain, and a setTimeout bound cannot preempt the queue's microtask chain (500 queued, 2598ms, 0 rejected)."
affects = ["s7.flight-recorder-onto-the-port"]

[[node]]
id = "s1.inventory-and-call-surface"
critical = true
status = "done"
depends_on = []
role = "The design cannot be costed without it: section 6 step 1 and two of the six section 9 deliverables."
action = "Classify every SQL construct per engine; audit the three interfaces by type and by caller."
constraint = "Measured, not estimated. Caller counts by AST (sqry direct_callers), not grep, because a string match cannot tell a call from a mention."
affects = ["s2.kill-the-raw-sql-read-path"]

[[node]]
id = "s2.kill-the-raw-sql-read-path"
critical = true
status = "done"
depends_on = ["s1.inventory-and-call-surface"]
role = "A port cannot abstract an engine behind a method whose argument IS that engine's dialect. queryRequests is not a missing seam, it is an anti-seam, and every later node is blocked on it."
action = "Replace the 7 raw-SQL call sites with named typed read operations on the recorder. queryRequests becomes private to the SQLite implementation."
constraint = "Pure refactor. Identical rows out, asserted against the existing tests before the signature changes. Add a ratchet that fails on a new caller-supplied SQL string, with the ADD-form negative control the design's section 9 requires."
affects = ["s3.define-the-async-port", "s7.flight-recorder-onto-the-port"]

[[node]]
id = "s3.define-the-async-port"
critical = true
status = "part 1 done: classes, roles, seam, inventory. Signatures follow s5."
depends_on = ["s2.kill-the-raw-sql-read-path"]
role = "Sync-over-async needs a worker thread; async-over-sync does not. CORRECTION: the design withdrew 'async-over-sync is free', so this is a structural claim and b1 measures the cost."
action = "Define the storage port over all three subsystems' operations, recounted in [meta].surface. No PRAGMA, no VACUUM, no SQL string anywhere in the surface."
constraint = "The port is types only until s4 and s5 give it two implementations. Do not land it with one."
affects = ["s4.two-drivers", "s6.write-ordering"]

[[node]]
id = "s4.two-drivers"
critical = true
status = "done"
depends_on = ["s3.define-the-async-port"]
role = "Two implementations from the start, because a port with one driver only ever fits that driver."
action = "SQLite driver over the existing node:sqlite code; Postgres driver with the per-role pool set and routing seam from design 3.1."
constraint = "Placeholder translation lives in the driver, never in a caller. The 50 `?`/`@name` bindings must not become 50 conditionals."
affects = ["s5.job-store-first"]

[[node]]
id = "s5.job-store-first"
critical = true
depends_on = ["s4.two-drivers"]
role = "It already has both engines, so the *-pg suites prove the port against real dual-engine behaviour before anything irreversible."
action = "Move JobStore onto the port; delete the worker-thread sync-over-async shim."
status = "done 2026-08-21, merged at 5fd1e5b. 4514 tests, check and test:pg all exit 0, verified by the controller not the track. Cost: 18 regressions this branch introduced, invisible to both the suite and the parity gate, found only by diffing two full runs; then 5 more in review, two of them durability (terminal persistence became RE-ENTRANT so the late-output rescue disarmed itself, and shutdown stopped waiting for non-Kit terminal writes). Both fixed by one wrapper because both came from one cause: an async body under fire-and-forget callers. Evidence: storage-s5-regressions-2026-08-21.md and design section 27."
constraint = "AMENDED 2026-08-21. `unchanged` cannot hold with this action: an async interface delivers failure as a rejection, and drivers/sqlite.ts:24 already forbids the alternative. The replacement is stronger and machine-checked: same tests, same matchers, same errors, no assertion weakened, across EVERY reached test file rather than the five *-pg ones. Sync-throw to rejects is the only permitted rewrite, by allowlist, with an ADD-form negative control. INSUFFICIENT AS WRITTEN, found 2026-08-21: hoisting an await off an assertion subject onto its declaration keeps matcher and value byte-identical while serialising work that was concurrent, so a test named `serialises transactions` stopped exercising the queue and still passed. Assertion identity must include await COUNT and POSITION, not just matcher and value. AND IT IS STILL NOT SUFFICIENT: parity held while 18 regressions landed, because parity compares assertions, not outcomes. Two full suites, main against the branch, is the control parity cannot be. Evidence: storage-s5-regressions-2026-08-21.md. STARTUP BARRIER, measured 2026-08-21 and a PRODUCTION change: a sync store let the constructor finish registration and the startup orphan sweep before returning, an async one cannot, and canAdmitDurableJobs() is a sync snapshot several fail-closed gates read. Inside that window the first Kit request is refused kit_busy, the api sync path runs INLINE and so skips dedup, and llm_process_health reports async jobs disabled. main() awaits whenStartupSettled() before connecting a transport, and the manager awaits it at every public entry point that observes durable state. Evidence: docs/evidence/storage-s5-design-2026-08-21.md sections 25.5 and 26."
bootstrap_ddl = "Stays under `app` for now. Design 3.1 process-separates the migrate credential, but moving it is a grant change on a live host, which operator decision 0a held. Recorded as gated, not deferred, and it is NOT routed through an operation class."
affects = ["s3sig.operation-signatures", "s6.write-ordering", "s8.sessions"]

[[node]]
id = "s13.whole-operation-deadline"
depends_on = ["s5.job-store-first"]
role = "Deleting the worker thread deleted its 35s bridge watchdog. Most of what that covered went with the thread: a wedged worker, a lost message, an Atomics.wait never released. One residual survives and is real. PG_STATEMENT_TIMEOUT_MS is per STATEMENT, so a multi-statement transaction has no aggregate bound; job-store.ts:2174 loops over providerLinks, about 175s worst case under pathological blocking."
action = "Give a whole operation a bound, once, on the port rather than per call site."
constraint = "A Promise.race deadline is WORSE than no deadline and must not be used. Rejecting the wrapper does not roll the transaction back: the client keeps going, the connection stays busy, and the caller now believes its mutation failed while it may still commit. That is precisely the ambiguity drivers/postgres.ts:300 says these timeouts exist to remove. The deadline path must CANCEL the query and destroy the connection, not merely stop waiting."
affects = []

[[node]]
id = "s3sig.operation-signatures"
critical = true
depends_on = ["s5.job-store-first"]
role = "Deliberately after s5, so two real drivers and one migrated subsystem shape the signatures rather than being authored blind."
action = "Author the per-subsystem operations across the inventory, and update STATE_INVENTORY where a determination changed."
constraint = "PRAGMA and VACUUM must be UNREACHABLE from the surface, not translated. No SQL string in any signature."
status = "done 2026-08-21. `src/storage/operations.ts`: FlightRecorderOperations, 12 async operations each declaring its class as DATA rather than as a literal per call site, plus FlightStartSink/FlightCompleteSink for the s6 conversion of FlightOwnership's two `() => void` slots. FOUR determinations s1 and s3 part 1 got wrong. (1) The audit's `FlightRecorder 7` is stale: s2 turned queryRequests into seven named reads, so the recorder is 13 members and the port's `42 operations` is 48. (2) `inPort = true` on approvals, admin_audit and workspace_registry names no node in this DAG and never did; STATE_INVENTORY now carries `owningNode` and the suite pins that unowned set at exactly those three. (3) The surface did not make PRAGMA and VACUUM unreachable and neither did the ratchet, which scanned template literals only while every PRAGMA in the tree sits in a quoted string. Rule 3 closes it, two-state control 6-of-12 red to 12 green. (4) Role separation is INERT for the job store: job-store.ts passes `write` at every call site including its reads, so on a four-credential deployment its reads still run as `app`. Declared classes are how s7 avoids inheriting that; s9 owns whether s5 is retrofitted."
not_authored = "Postgres transcript operations, per decision 0a and [facts].schema_gap: that schema is new authorship and this run does not do it. Sessions, because s8 owns them and is live. approvals, admin_audit and workspace_registry, because no node implements them and a surface with no implementer is the speculative generality this programme keeps paying for. `flush()`, which has zero callers and is a no-op. Retention terminations, which are s11's."
affects = ["s6.write-ordering", "s7.flight-recorder-onto-the-port"]

[[node]]
id = "s6.write-ordering"
critical = true
depends_on = ["s3sig.operation-signatures"]
role = "Design 3.4, and revision 1 got this wrong: a per-correlation in-process queue does NOT cover crash between start and complete, nor orphan completion by a different instance."
action = "Specify and test ordering across every 3.4 failure mode, including cross-process orphan completion and crash-restart."
constraint = "FlightOwnership (index.ts:2587) is the failure site: every inline flight write funnels through that ONE sync class, and its started/managerOwnsCompletion flags are idempotence fences. Awaiting inside a state machine whose idempotence is a boolean makes the boolean a race."
status = "done 2026-08-21. FlightOwnership is src/flight-ownership.ts on FlightStartSink/FlightCompleteSink. Both flags are claimed in the SYNCHRONOUS prologue so no yield can straddle a decision; only the write defers, onto a per-request chain that orders complete behind start and cannot be poisoned by a rejected start. No per-correlation map, which is the structural answer to revision 1's queue growth. The load-bearing find: the `await` on start() is what fences the CROSS-WRITER case, because execute cannot dispatch until the start row is down, so armFlightCompleteForDeferral cannot let the manager complete a row that does not exist. Suite set difference 0 removed / 22 added (4543 to 4565), 0 failures either side; check, test and test:pg exit 0. Evidence: docs/evidence/storage-s6-2026-08-21.md."
specification = "src/storage/write-ordering.ts: 15 rules, one per 3.4 failure mode plus its four unspecified items plus three in-process invariants, each carrying owner, status and the test that RUNS it. write-ordering-spec.test.ts fails if a named test does not exist and if a design 3.4 bullet is no longer answered, so this constraint is not the third unexecuted assertion in this map. Six rules CHARACTERISE losses s7 inherits: a completion with no start row silently changes nothing, early routing telemetry is gone for good, a reused id attaches the completion to the FIRST request. Two are unenforced and say why: the cancelling completion deadline is s13's mechanism, the reconciliation side table is part of the transcript schema s7 authors. NOT converted, deliberately: recordRouting and recordCompressionTelemetry stay synchronous and off the chain, as do the manager's writeFlightComplete and the #139 sweep, because all four are recorder operations s7 moves."
affects = ["s7.flight-recorder-onto-the-port"]

[[node]]
id = "s7.flight-recorder-onto-the-port"
critical = true
depends_on = ["s2.kill-the-raw-sql-read-path", "s6.write-ordering", "b1.sqlite-async-benchmark"]
role = "Closes the original defect: the recorder starts obeying [persistence].backend."
action = "Author the Postgres transcript schema (new, not a migration), move the recorder onto the port, convert FlightOwnership to async."
constraint = "HARD GATE: transcript BODIES do not enter Postgres until postgres-security-hardening.md section 6 is complete through step 8, inheriting that sequence in full rather than naming a cut-off that can drift."
pre_positioned = "performShutdown awaits activeHttpGateway.close, activeServer.close and jobStore.close, but NOT flightRecorder.close, which is harmless only while the recorder is synchronous. s7 makes it async and the line becomes jobStore's defect exactly: exit mid-close, and a log line asserting a close that did not finish. s5's no-floating-promises ratchet is the control that makes it impossible to introduce silently."
scope_0a = "This run stops with the recorder on the port under the SQLite driver, and authors nothing that moves bodies. Security section 6 is at step 2 of 10."
affects = ["s9.one-selector"]

[[node]]
id = "s8.sessions"
withdrawn_blocker = "I wrote that four drifted CHECK (cli IN ...) lists in migrations 001 and 003 would REJECT devin and cursor on a backend=postgres host. The drift is real; the consequence was wrong. Migration 005 already DROPS both enumerated constraints for a format regex and 006 never carried them, so at head they reject nothing. I read 2 of 21 migration files and asserted a runtime consequence from them. s8 settled it against a real database with a control that fails loudly if the two sets ever agree vacuously. They also cannot be corrected: POSTGRES_IMMUTABLE_MIGRATION_SHA256 pins each file and a mismatch refuses to migrate, so editing one byte bricks migration for every installation that ran it, and generating them from CLI_TYPES would be the same failure on a timer. Frozen with a pinned count instead. The .sql blind spot in the ratchet was real and is closed."
depends_on = ["s5.job-store-first"]
role = "The third split subsystem, selected by DATABASE_URL and disconnected from [persistence] entirely."
action = "Collapse FileSessionManager and session-manager-pg onto the port."
constraint = "migrate-sessions.ts already implements a transactional sessions.json to Postgres move with rollback. Reuse it; do not re-author it."
status = "done 2026-08-21. Session store on PostgresStorageDriver: db.ts's second pool is gone, no `pg` import survives outside src/storage/drivers, and 12 hand-rolled transactions are the driver's. The BLOCKER is cleared and its consequence was wrong: the four hand-written CHECK (cli IN ...) lists drifted both ways, but migration 005 already drops both for a format guard, so a database at head admits devin and cursor, proven by applying the real migrations with the pre-005 rejection as the control. They cannot be corrected either, because POSTGRES_IMMUTABLE_MIGRATION_SHA256 pins each file and the runner refuses a mismatch: frozen with a pinned count in a gate that now scans .sql, domain asserted from PROVIDER_TYPES in a test. Suite set difference 0 removed / 8 added (4514 to 4522), pg 0 removed / 2 added (133 to 135), zero failures either side. Found by doing it: the driver's `?` to `$n` rewrite cannot tell a placeholder from jsonb's key-exists OPERATOR. Evidence: docs/evidence/storage-s8-2026-08-21.md."
affects = ["s9.one-selector"]

[[node]]
id = "s9.one-selector"
depends_on = ["s7.flight-recorder-onto-the-port", "s8.sessions"]
role = "The point of the whole exercise: one config value that actually moves everything."
action = "Demote DATABASE_URL and LLM_GATEWAY_LOGS_DB to deprecated compatibility inputs, asymmetrically per design 3.3, AND carry [persistence.roles] through to PostgresStorageDriver. Design 3.1: unifying the config and unifying the pool are one task, and no node owned the second half."
constraint = "DATABASE_URL is a DSN and today emits NO deprecation warning, unlike LLM_GATEWAY_LOGS_DB. Conflicts must be a startup error, never a silent precedence rule."
affects = ["s10.cutover"]

[[node]]
id = "s10.cutover"
critical = true
status = "HELD by operator decision 0a: a separate human-supervised run."
depends_on = ["s9.one-selector"]
role = "The last cutover abandoned 31,895 rows in place rather than migrating them. That is the precedent to not repeat."
action = "Lossless restartable backfill with reconciliation output, rehearsed against a copy first."
constraint = "npm run migrate is DDL-only. Backfill is NOT optional and is not the same thing. Removing the superseded SQLite tables is part of the cutover, or the stale copy returns."

[[node]]
id = "s11.retention"
depends_on = ["s9.one-selector"]
role = "Only `jobs` is bounded today. validation_runs has wedged rows and logs.db grows without limit, because retention belongs to a subsystem that is not the one growing."
action = "Express retention once, over every subsystem the port carries."
constraint = "Retention economics differ per engine: Postgres drops partitions, SQLite needs DELETE plus a VACUUM that takes a long exclusive lock on a 1.2 GB file. One policy, two terminations."
affects = []

[[node]]
id = "s12.lint-the-tests"
critical = true
depends_on = ["s5.job-store-first"]
role = "eslint.config.js:8 ignores **/*.test.ts globally, so 290 test files have NEVER been linted. That is pre-existing debt, and this programme fixes debt rather than recording it."
action = "Lift the ignore, measure honestly, fix what it finds, and keep the suite in npm run check from then on. The COLLECT half is done (7a8a209): check-test-collection.mjs compares the collected SET against git ls-files, covering the five *-pg suites and integration.test.ts that npm test never runs and nothing else verified either. A set, not the floor first planned, because a count only controls anything if something compares it. ALSO: no gate typechecks tests at all. npm run check builds tsconfig.build.json, which excludes them, and vitest transpiles without typechecking, MEASURED on main 2026-08-21: `tsc --noEmit -p tsconfig.json` reports 352 errors, ALL 352 in tests and ZERO outside them, which is exactly s12's premise rather than an approximation of it. Triage them; some will be deliberate invalid-input tests, so measure before assuming all 356 are defects."
constraint = "MEASURED at 15c7eee across 281 files: 27 errors, 1 parse error, 1259 warnings, plus 6 no-misused-promises and 11 no-floating-promises PRE-EXISTING. Warnings do not fail the build (production carries 848 and exits 0), so the blocking set is ~44 and an afternoon. The current tree reports 354 floating promises; 343 are s5 test-migration residue, not s12 debt, and scoping from that number would have been wrong by 30x. Triage warnings BY RULE, not by site: a rule inapplicable to tests gets scoped off deliberately and recorded, never suppressed site by site."
affects = []
