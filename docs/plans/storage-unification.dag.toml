[[node]]
id = "s5.job-store-first"
critical = true
depends_on = ["s4.two-drivers"]
role = "It already has both engines, so the *-pg suites prove the port against real dual-engine behaviour before anything irreversible."
action = "Move JobStore onto the port; delete the worker-thread sync-over-async shim."
status = "done 2026-08-21, merged at 5fd1e5b. 4514 tests, check and test:pg all exit 0, verified by the controller not the track. Cost: 18 regressions this branch introduced, invisible to both the suite and the parity gate, found only by diffing two full runs; then 5 more in review, two of them durability (terminal persistence became RE-ENTRANT so the late-output rescue disarmed itself, and shutdown stopped waiting for non-Kit terminal writes). Both fixed by one wrapper because both came from one cause: an async body under fire-and-forget callers. Evidence: storage-s5-regressions-2026-08-21.md and design section 27."
constraint = "AMENDED 2026-08-21. `unchanged` cannot hold with this action: an async interface delivers failure as a rejection, and drivers/sqlite.ts:24 already forbids the alternative. The replacement is stronger and machine-checked: same tests, same matchers, same errors, no assertion weakened, across EVERY reached test file rather than the five *-pg ones. Sync-throw to rejects is the only permitted rewrite, by allowlist, with an ADD-form negative control. INSUFFICIENT AS WRITTEN, found 2026-08-21: hoisting an await off an assertion subject onto its declaration keeps matcher and value byte-identical while serialising work that was concurrent, so a test named `serialises transactions` stopped exercising the queue and still passed. Assertion identity must include await COUNT and POSITION, not just matcher and value. AND IT IS STILL NOT SUFFICIENT: parity held while 18 regressions landed, because parity compares assertions, not outcomes. Two full suites, main against the branch, is the control parity cannot be. Evidence: storage-s5-regressions-2026-08-21.md. STARTUP BARRIER, measured 2026-08-21 and a PRODUCTION change: a sync store let the constructor finish registration and the startup orphan sweep before returning, an async one cannot, and canAdmitDurableJobs() is a sync snapshot several fail-closed gates read. Inside that window the first Kit request is refused kit_busy, the api sync path runs INLINE and so skips dedup, and llm_process_health reports async jobs disabled. main() awaits whenStartupSettled() before connecting a transport, and the manager awaits it at every public entry point that observes durable state. Evidence: docs/evidence/storage-s5-design-2026-08-21.md sections 25.5 and 26."
bootstrap_ddl = "Stays under `app` for now. Design 3.1 process-separates the migrate credential, but moving it is a grant change on a live host, which operator decision 0a held. Recorded as gated, not deferred, and it is NOT routed through an operation class."
affects = ["s3sig.operation-signatures", "s6.write-ordering", "s8.sessions"]

[[node]]
id = "s13.whole-operation-deadline"
depends_on = ["s5.job-store-first"]
role = "Deleting the worker thread deleted its 35s bridge watchdog. Most of what that covered went with the thread: a wedged worker, a lost message, an Atomics.wait never released. One residual survives and is real. CORRECTED by doing it: the cited site job-store.ts:2174 is SqliteJobStore (job-store.ts:1225 declares SqliteStorageDriver), so PG_STATEMENT_TIMEOUT_MS never applied to it and 175s was the wrong number on the wrong engine. The Postgres analogue is postgres-job-store-ops.ts:1119, 4 + N statements where N is the deduped provider set (7 CLI plus every enabled API provider), so 11 statements and 275s against statement_timeout, 55s against lock_timeout. And the residual exists on SQLITE too: job-store.ts:1302 sets PRAGMA busy_timeout = 5000 for #139, which is per statement and blocks the whole THREAD."
action = "Give a whole operation a bound, once, on the port rather than per call site."
constraint = "A Promise.race deadline is WORSE than no deadline and must not be used. Rejecting the wrapper does not roll the transaction back: the client keeps going, the connection stays busy, and the caller now believes its mutation failed while it may still commit. That is precisely the ambiguity drivers/postgres.ts:300 says these timeouts exist to remove. The deadline path must CANCEL the query and destroy the connection, not merely stop waiting. CORRECTION 2026-08-22, refuted by experiment: I also briefed that the deadline firing mid-body could not itself become a second entrant. FALSE. A reviewer reproduced the opposite with a deterministic fake pool: `release(expiry)` returns pool capacity IMMEDIATELY, so a replacement transaction can begin and commit before the expired callback resumes. No row is lost, because the expired transaction still cannot commit, so the shipped behaviour stands. The CLAIM was wrong, and it was mine."
status = "done 2026-08-21. STORAGE_TRANSACTION_DEADLINE_MS on driver.transaction, both engines, one constant. Postgres DESTROYS the pinned client: release(err) removes it from the pool and pg ends a client with a query in flight by destroying the socket (client.js:end), so COMMIT can no longer be sent and the transaction cannot land. Cancel was considered and rejected with reasons: it aborts the statement but not the transaction, so a destroy is needed after it anyway, and reaching pg's protocol cancel needs the active Query object plus a second connection out of a max:1 pool. Disarmed and checked in ONE synchronous block before COMMIT, because firing there is the only case that would MANUFACTURE the ambiguity. SQLite cannot use a timer at all (measured: one contended statement blocks 5003ms and a 200ms timer armed first runs at 5004ms) and node:sqlite has no interrupt, so it reads the clock at each statement boundary and rolls back, abandoning nothing. Residual, measured not assumed: PostgreSQL does not notice a dead client mid-statement (client_connection_check_interval is 0), so the backend survives the destroy until its statement ends, bounded by statement_timeout. Suite 4543 to 4548, pg 135 to 138, 0 removed, 0 failures either side; four mutation controls each 38/1 against 39/0. bootstrap DDL and withConnection are deliberately unbounded and say why. Evidence: docs/evidence/storage-s13-2026-08-21.md."
affects = []

[[node]]
id = "s3sig.operation-signatures"
critical = true
depends_on = ["s5.job-store-first"]
role = "Deliberately after s5, so two real drivers and one migrated subsystem shape the signatures rather than being authored blind."
action = "Author the per-subsystem operations across the inventory, and update STATE_INVENTORY where a determination changed."
constraint = "PRAGMA and VACUUM must be UNREACHABLE from the surface, not translated. No SQL string in any signature."
status = "done 2026-08-21. `src/storage/operations.ts`: FlightRecorderOperations, 12 async operations each declaring its class as DATA rather than as a literal per call site, plus FlightStartSink/FlightCompleteSink for the s6 conversion of FlightOwnership's two `() => void` slots. FOUR determinations s1 and s3 part 1 got wrong. (1) The audit's `FlightRecorder 7` is stale: s2 turned queryRequests into seven named reads, so the recorder is 13 members and the port's `42 operations` is 48. (2) `inPort = true` on approvals, admin_audit and workspace_registry names no node in this DAG and never did; STATE_INVENTORY now carries `owningNode` and the suite pins that unowned set at exactly those three. (3) The surface did not make PRAGMA and VACUUM unreachable and neither did the ratchet, which scanned template literals only while every PRAGMA in the tree sits in a quoted string. Rule 3 closes it, two-state control 6-of-12 red to 12 green. (4) Role separation is INERT for the job store: job-store.ts passes `write` at every call site including its reads, so on a four-credential deployment its reads still run as `app`. Declared classes are how s7 avoids inheriting that; s9 owns whether s5 is retrofitted."
not_authored = "Postgres transcript operations, per decision 0a and [facts].schema_gap: that schema is new authorship and this run does not do it. Sessions, because s8 owns them and is live. approvals, admin_audit and workspace_registry, because no node implements them and a surface with no implementer is the speculative generality this programme keeps paying for. `flush()`, which has zero callers and is a no-op. Retention terminations, which are s11's."
affects = ["s6.write-ordering", "s7.flight-recorder-onto-the-port"]

[[node]]
id = "s6.write-ordering"
critical = true
depends_on = ["s3sig.operation-signatures"]
role = "Design 3.4, and revision 1 got this wrong: a per-correlation in-process queue does NOT cover crash between start and complete, nor orphan completion by a different instance."
action = "Specify and test ordering across every 3.4 failure mode, including cross-process orphan completion and crash-restart."
constraint = "FlightOwnership (index.ts:2587) is the failure site: every inline flight write funnels through that ONE sync class, and its started/managerOwnsCompletion flags are idempotence fences. Awaiting inside a state machine whose idempotence is a boolean makes the boolean a race."
status = "done 2026-08-21. FlightOwnership is src/flight-ownership.ts on FlightStartSink/FlightCompleteSink. Both flags are claimed in the SYNCHRONOUS prologue so no yield can straddle a decision; only the write defers, onto a per-request chain that orders complete behind start and cannot be poisoned by a rejected start. No per-correlation map, which is the structural answer to revision 1's queue growth. The load-bearing find: the `await` on start() is what fences the CROSS-WRITER case, because execute cannot dispatch until the start row is down, so armFlightCompleteForDeferral cannot let the manager complete a row that does not exist. Suite set difference 0 removed / 22 added (4543 to 4565), 0 failures either side; check, test and test:pg exit 0. Evidence: docs/evidence/storage-s6-2026-08-21.md."
specification = "src/storage/write-ordering.ts: 15 rules, one per 3.4 failure mode plus its four unspecified items plus three in-process invariants, each carrying owner, status and the test that RUNS it. write-ordering-spec.test.ts fails if a named test does not exist and if a design 3.4 bullet is no longer answered, so this constraint is not the third unexecuted assertion in this map. Six rules CHARACTERISE losses s7 inherits: a completion with no start row silently changes nothing, early routing telemetry is gone for good, a reused id attaches the completion to the FIRST request. Two are unenforced and say why: the cancelling completion deadline is s13's mechanism, the reconciliation side table is part of the transcript schema s7 authors. NOT converted, deliberately: recordRouting and recordCompressionTelemetry stay synchronous and off the chain, as do the manager's writeFlightComplete and the #139 sweep, because all four are recorder operations s7 moves."
affects = ["s7.flight-recorder-onto-the-port"]

[[node]]
id = "s7.flight-recorder-onto-the-port"
critical = true
depends_on = ["s2.kill-the-raw-sql-read-path", "s6.write-ordering", "b1.sqlite-async-benchmark"]
role = "Closes the original defect: the recorder starts obeying [persistence].backend."
action = "Author the Postgres transcript schema (new, not a migration), move the recorder onto the port, convert FlightOwnership to async."
constraint = "HARD GATE: transcript BODIES do not enter Postgres until postgres-security-hardening.md section 6 is complete through step 8, inheriting that sequence in full rather than naming a cut-off that can drift."
status = "done 2026-08-21, SQLite driver only. FlightRecorder implements FlightRecorderOperations over SqliteStorageDriver: 12 async operations, each routed by the class s3sig declared as DATA rather than the literal `write` the job store passes everywhere, so the recorder does not inherit that inert role separation. STOPPED EXACTLY AT 0a and the stop is now VISIBLE rather than silent: `flightRecorderEngineDecision` refuses `backend = postgres` with the security-section-6 reason and llm_process_health reports it, because honouring it needs the transcript schema [facts].schema_gap says is new authorship. `backend = none` is deliberately NOT wired to silence the recorder; that is s9 reconciling two inputs, not a refactor. TWO defects found by doing it, both live. (1) AcpFlightSink declared `logStart(entry): void`, so the async recorder's promises were absorbed by the TYPE and every ACP flight write was dropped in silence, which no lint rule can see; the sink is Promise<void> now and a test checks the class of declaration, not the site. (2) close() drained the driver's queue but not the gap between an operation being CALLED and reaching that queue, so `logStart(x); close()` in one tick lost the row to the very call meant to save it. MERGE FENCE SETTLED by the experiment s6 could not run: across writers it is REQUIRED (an earlier-decided completion landing second overwrites the final response body, silently, while the fenced status stays monotonic and hides it), within one recorder it is unreachable (one driver queue makes submission order landing order). Not built: the revision column is transcript-schema authorship 0a stops. flightRecorder.close() awaited in performShutdown; `flush` deleted rather than ported. Suite 4570 to 4585, 0 removed. Evidence: docs/evidence/storage-s7-2026-08-21.md."
pre_positioned = "performShutdown awaits activeHttpGateway.close, activeServer.close and jobStore.close, but NOT flightRecorder.close, which is harmless only while the recorder is synchronous. s7 makes it async and the line becomes jobStore's defect exactly: exit mid-close, and a log line asserting a close that did not finish. s5's no-floating-promises ratchet is the control that makes it impossible to introduce silently."
affects = ["s9.one-selector", "s7pg.transcripts-into-postgres"]

[[node]]
id = "s7pg.transcripts-into-postgres"
critical = true
depends_on = ["s7.flight-recorder-onto-the-port", "s9.one-selector"]
role = "The capability every node so far stopped short of: `[persistence].backend = postgres` actually moves request history."
action = "Author the Postgres transcript schema, gate it on deployment shape, and return the Postgres engine from the ONE decision point."
constraint = "NO backfill, NO dual write, NO reading from both. s10 is the human-supervised cutover; a host that switches starts writing to the new engine and its old rows stay put, which llm_process_health must SAY."
status = "done 2026-08-22. migrations/022 authors `requests` and `gateway_metadata` in real Postgres types, decided against `pg`'s measured behaviour rather than against the SQL standard: DOUBLE PRECISION not NUMERIC and INTEGER not BIGINT because pg returns BOTH of those as STRINGS (`c=\"0.00012300\"`, `b=\"42\"`), so the `better` type silently changes `cost_usd: number` at every reader; datetime_utc stays TEXT because timestamptz returns a Date. `COUNT(*)` needs `::int` for the same reason. transcript-admission.ts resolves deployment shape ONCE, synchronously, as data: loopback literal or unix socket AND the listener's uid from /proc equal to this process's, with a name other than `localhost` REFUSED because resolving it would need an await the health surfaces cannot take. FOUND BY RUNNING IT: a `to_regclass` guard does not defer name resolution, so the guarded statement still failed to parse on the very database it guarded. The bootstrap DDL and the migration are held identical by a control that applies both to real schemas and diffs information_schema. Evidence: docs/evidence/storage-s7pg-2026-08-22.md."
affects = ["s10.cutover", "s11.retention"]

[[node]]
id = "s8.sessions"
withdrawn_blocker = "I wrote that four drifted CHECK (cli IN ...) lists in migrations 001 and 003 would REJECT devin and cursor on a backend=postgres host. The drift is real; the consequence was wrong. Migration 005 already DROPS both enumerated constraints for a format regex and 006 never carried them, so at head they reject nothing. I read 2 of 21 migration files and asserted a runtime consequence from them. s8 settled it against a real database with a control that fails loudly if the two sets ever agree vacuously. They also cannot be corrected: POSTGRES_IMMUTABLE_MIGRATION_SHA256 pins each file and a mismatch refuses to migrate, so editing one byte bricks migration for every installation that ran it, and generating them from CLI_TYPES would be the same failure on a timer. Frozen with a pinned count instead. The .sql blind spot in the ratchet was real and is closed."
depends_on = ["s5.job-store-first"]
role = "The third split subsystem, selected by DATABASE_URL and disconnected from [persistence] entirely."
action = "Collapse FileSessionManager and session-manager-pg onto the port."
constraint = "migrate-sessions.ts already implements a transactional sessions.json to Postgres move with rollback. Reuse it; do not re-author it."
status = "done 2026-08-21. Session store on PostgresStorageDriver: db.ts's second pool is gone, no `pg` import survives outside src/storage/drivers, and 12 hand-rolled transactions are the driver's. The BLOCKER is cleared and its consequence was wrong: the four hand-written CHECK (cli IN ...) lists drifted both ways, but migration 005 already drops both for a format guard, so a database at head admits devin and cursor, proven by applying the real migrations with the pre-005 rejection as the control. They cannot be corrected either, because POSTGRES_IMMUTABLE_MIGRATION_SHA256 pins each file and the runner refuses a mismatch: frozen with a pinned count in a gate that now scans .sql, domain asserted from PROVIDER_TYPES in a test. Suite set difference 0 removed / 8 added (4514 to 4522), pg 0 removed / 2 added (133 to 135), zero failures either side. Found by doing it: the driver's `?` to `$n` rewrite cannot tell a placeholder from jsonb's key-exists OPERATOR. Evidence: docs/evidence/storage-s8-2026-08-21.md."
affects = ["s9.one-selector"]

[[node]]
id = "s9.one-selector"
depends_on = ["s7.flight-recorder-onto-the-port", "s8.sessions"]
role = "The point of the whole exercise: one config value that actually moves everything."
action = "Demote DATABASE_URL and LLM_GATEWAY_LOGS_DB to deprecated compatibility inputs, asymmetrically per design 3.3, AND carry [persistence.roles] through to PostgresStorageDriver. Design 3.1: unifying the config and unifying the pool are one task, and no node owned the second half."
constraint = "CORRECTED 2026-08-22, the premise was stale. DATABASE_URL DOES warn today, in three precedence cases at config.ts:109/:124/:136, and conflicts are already refused rather than silently resolved. b902ccf did that half. What is left is a real decision, not a fix: warn-and-ignore is not silent but it is not an error either, and this node must rule on whether a conflict SHOULD abort startup. The roles half is genuinely unbuilt: `[persistence.roles]` appears NOWHERE in config.ts, so PostgresStorageDriver accepts PostgresRoleDsns that nothing produces, and job-store.ts passes \"write\" at all 7 transaction sites, so on a four-credential deployment its reads still run as `app`. Verified 2026-08-22 before briefing, because two node premises I wrote from source text alone were disproved by tracks the day before."
status = "done 2026-08-22. ROLES: `[persistence.roles]` is a strict table (reader/analytics/retention only) resolved into `PersistenceConfig.roleDsns` and threaded to BOTH driver sites, job store and sessions, with `[persistence].dsn` the single source for `app`. `app` and `migrate` are refused BY NAME, and a misspelled role is refused rather than silently degrading a reader onto `app` while the operator believes separation is in force. CONFLICT: warn-and-refuse is CORRECT and the constraint is amended, not implemented. A conflict is already fully determined and resolves to what the config file says, so an abort protects nothing and takes down a mid-migration host over a variable the gateway ignores. What was actually missing was a durable answer, so the rule is now DATA (`resolveDatabaseUrlPrecedence`), reported on `llm_process_health` as `deprecatedInputs` instead of only a one-time boot warning. JOB-STORE ROLES: reads stay on `app`, because 4.3 gives `llmgw_app` SELECT and scopes `llmgw_reader` to transcripts with RLS on `requests`/`gateway_metadata`; routing job reads to it would ask a credential for tables it has no grant on. The ONE site 4.3 names is `evictExpired`, now `retention` on both engines, which is what lets `llmgw_app` hold no DELETE on `jobs`. SQLite is unchanged by that, verified in code rather than by assuming symmetry: `READ_ONLY_OPERATIONS` in drivers/sqlite.ts is {transcript_read, analytics_read}, so `retention` still resolves to the writable handle and nothing newly touches `openReadOnly`. The read-only-handle question is real but belongs to a retrofit of `allSql`, which is NOT done. NOTE: design 27.7 could not be read; docs/evidence/storage-s5-design-2026-08-21.md, which the s5 node cites, does not exist on this host. LOGS_DB: two subsystems, two switches; `backend = \"none\"` does NOT silence the recorder, and a startup `Storage:` block says where request history went either way. Suite 4587 to 4620, 0 removed; pg 138 to 138, 0 removed/0 added. Six mutation controls, each red before and green after."
affects = ["s10.cutover"]

[[node]]
id = "s10.cutover"
critical = true
status = "HELD by operator decision 0a: a separate human-supervised run."
depends_on = ["s9.one-selector"]
role = "The last cutover abandoned 31,895 rows in place rather than migrating them. That is the precedent to not repeat."
action = "Lossless restartable backfill with reconciliation output, rehearsed against a copy first."
constraint = "npm run migrate is DDL-only. Backfill is NOT optional and is not the same thing. Removing the superseded SQLite tables is part of the cutover, or the stale copy returns."

[[node]]
id = "s11.retention"
depends_on = ["s9.one-selector"]
role = "Only `jobs` is bounded today. validation_runs has wedged rows and logs.db grows without limit, because retention belongs to a subsystem that is not the one growing."
action = "Express retention once, over every subsystem the port carries."
constraint = "Retention economics differ per engine: Postgres drops partitions, SQLite needs DELETE plus a VACUUM that takes a long exclusive lock on a 1.2 GB file. One policy, two terminations."
status = "done 2026-08-22. `storage/retention.ts` is the policy as DATA and every surface derives from it, which is what removed doctor.ts's hard-coded `unbounded = [\"requests\"]`, the second place a retention decision was being taken. `jobs` is UNCHANGED (30 days from retentionDays); `requests` and `wedgedValidationRuns` are new bounds that DEFAULT TO OFF, so an upgrade deletes nothing and an operator opts in through a `.strict()` `[persistence.retention]` table where a misspelled key is refused rather than silently applying no bound. CONSTRAINT PREMISE DISPROVED: Postgres does not drop partitions here, because migrations/022 authors `requests` and `gateway_metadata` as plain unpartitioned tables. The statement is therefore the SAME on both engines and only the AFTERMATH differs: autovacuum reuses the space with no operator step, while SQLite puts pages on a freelist and never shrinks the file, so `storage compact --yes` exists as an explicit stopped-gateway command and never a timer. WEDGED, defined before deleting: not `finalized`, older than the horizon, and NO link row still pointing at a surviving job, because while any linked job lives `validation_receipt` mint-on-read can still finalize the run. FOUND BY RUNNING IT, twice: `gateway_metadata.request_id REFERENCES requests(id)` has no ON DELETE CASCADE on EITHER engine, so the obvious single `DELETE FROM requests` fails the constraint on every row and both controls prove it by running it; and `PRAGMA freelist_count` returns a column of that name, so reading `row.n` off it yielded undefined and reported a truthful-looking 0 reclaimable bytes. NOT DELETED, deliberately: the abandoned 31,895-row `jobs` table (s10 owns it and a retention feature must not remove a user's data as a side effect), `finalized` runs and their immutable receipts, and sessions (s8/rf/dur own them). The sweep report is KEPT and reported, because `evictExpired` has always returned a count whose only reader was a debug line guarded on `> 0`. Suite 4687 to 4722, 0 removed; pg 164 to 172, 0 removed. 13 mutation controls, each red on exactly its own tests. Evidence: docs/evidence/storage-s11-2026-08-22.md."
affects = []

[[node]]
id = "s12.lint-the-tests"
critical = true
depends_on = ["s5.job-store-first"]
role = "eslint.config.js:8 ignores **/*.test.ts globally, so 290 test files have NEVER been linted. That is pre-existing debt, and this programme fixes debt rather than recording it."
action = "Lift the ignore, measure honestly, fix what it finds, and keep the suite in npm run check from then on. The COLLECT half is done (7a8a209): check-test-collection.mjs compares the collected SET against git ls-files, covering the five *-pg suites and integration.test.ts that npm test never runs and nothing else verified either. A set, not the floor first planned, because a count only controls anything if something compares it. ALSO: no gate typechecks tests at all. npm run check builds tsconfig.build.json, which excludes them, and vitest transpiles without typechecking, MEASURED on main 2026-08-21: `tsc --noEmit -p tsconfig.json` reports 352 errors, ALL 352 in tests and ZERO outside them, which is exactly s12's premise rather than an approximation of it. Triage them; some will be deliberate invalid-input tests, so measure before assuming all 356 are defects."
constraint = "MEASURED at 15c7eee across 281 files: 27 errors, 1 parse error, 1259 warnings, plus 6 no-misused-promises and 11 no-floating-promises PRE-EXISTING. Warnings do not fail the build (production carries 848 and exits 0), so the blocking set is ~44 and an afternoon. The current tree reports 354 floating promises; 343 are s5 test-migration residue, not s12 debt, and scoping from that number would have been wrong by 30x. Triage warnings BY RULE, not by site: a rule inapplicable to tests gets scoped off deliberately and recorded, never suppressed site by site."
affects = []

[[node]]
id = "rf.decisions-that-do-not-reach-their-statement"
depends_on = ["s8.sessions"]
role = "Three review findings, one shape: a decision taken in one place and a write that does not re-take it. Not a design node, a fix list."
action = "1. Carry the session_delete owner into the statement on BOTH engines. 2. Stop an expiring file session deleting itself under a successful response. 3. Settle whether unfenced Postgres metadata merges regress under concurrent turns, against a real server."
constraint = "Every fix gets a control that FAILS on the unfixed code, run in both states. The races are driven by a two-way barrier, never a sleep, and defect 1 asserts the STORE, not the caller's return value. Defect 3 is INFERRED and may not be fixed on the inference."
status = "done 2026-08-22. 1: the owner is in the DELETE on both engines, `principalScopeSql` supplying the one spelling of the rule, and TTL eviction moved to a private unowned path so an expired row is still cleared. WORSE THAN BRIEFED: on PostgreSQL the manager had NO owner check at all, so bob deleting alice's session returned true and removed the row; the handler was the only control. Same separation FOUND AND FIXED in setActiveSession, where the target is now selected by owner in the statement that writes the pointer. Surveyed and left: clearAllSessions deletes every row regardless of owner and has no production caller, which is a loaded gun on the interface. 2: HONOUR THE WRITE, chosen because PostgreSQL never carried the expiry check, so honouring makes the engines agree instead of inventing a third rule; lastUsedAt refreshes only when the row had expired. The void contract is gone and a lost write reaches the caller as sessionContinuityPersisted. 3: REPRODUCES, settled by experiment not inference. Through the real request path against a real PostgreSQL server, two concurrent turns on one session left the EARLIER turn's handle in the row 3 of 200 pairs with both callers told true; 9 to 38 of 200 at a 9us synthetic dispatch gap, 0 of 50 when awaited, 1 to 7 of 30 with the pool saturated. Fixed by compare-and-set on the metadata the turn READ, chosen over a timestamp fence because the store is SHARED across instances and a wall clock is not an ordering. Semantic change: the first committer owns the thread and the loser is TOLD. Every control run in both states, plus a fence-only mutation probe that isolates the fence from the reporting. Suite 4624 to 4634, 0 removed; pg 138 to 142, 0 removed. Evidence: docs/evidence/storage-rf-2026-08-22.md."
affects = []

[[node]]
id = "dur.the-next-line-can-now-yield"
depends_on = ["s5.job-store-first", "rf.decisions-that-do-not-reach-their-statement"]
role = "Four durability defects, one shape: a write that was safe only because the store was synchronous and the next line could not yield. Not a design node, a fix list."
action = "1. Fence `recordOutput` on status, on both engines, so an orphaned row stops absorbing this instance's output while its status stays monotonic and hides the move. 2. Make the SQLite heartbeat ONE transaction, as Postgres already is, so the sweep cannot slot between the instance row and the job leases. 3. Land the validation receipt and its run status in one transaction, and stop `stored ?? record` reporting `minted` for something that was never stored. 4. Take `sessions.last_used_at` off the client clock so a later-finishing earlier turn cannot regress the column `cleanup_expired_sessions` DELETES on."
constraint = "Every fix gets a control that FAILS on the unfixed code, run in both states, both numbers reported. All four are races: two-way barriers, never sleeps, because a control synchronised on the defect measures itself. Assert the DATABASE, not the caller's return value. Defect 4 may NOT be fenced on a wall clock: the store is shared across instances and rf already settled that a client clock is not an ordering."
status = "done 2026-08-22. 1: both engines fence `recordOutput` on an expected-status set the manager decides ONCE (`ownedOutputStatuses`), so the routine flush and the late write cannot disagree, and a rejected write is reported instead of discarded by a void return. 2: one transaction, and the return is `HeartbeatOutcome`, so a GC'd instance row is re-registered rather than heartbeated into nothing forever. 3: receipt, run status and read-back in one transaction; a run that cannot be finalized rolls the receipt back with it, and `stored ?? record` is gone. 4: the DATABASE's `clock_timestamp()` under `GREATEST`, not a client Date, chosen over a CAS because the column's only requirement is that it never regresses and GREATEST holds whichever writer commits last; proven against a real server through a HELD ROW LOCK, which is also what proves the guard survives Postgres re-evaluating the SET expression against the newer row version. METHOD FINDING: two controls were first driven by submitting both operations in one tick and trusting the driver's FIFO queue. Submission order is decided by how many microtask hops precede `driver.transaction`, not by the defect, and BOTH failed on the fixed code. Replaced with a snapshot after every committed transaction, taken on a separate handle, which checks the atomicity claim against every state an outside reader could see. Controls, each red before and green after: sqlite 2/1, 1/2, 3/1; postgres 1, 1, 1; sessions 2/2. Suite 4634 to 4644, 0 removed; pg 142 to 147, 0 removed. Evidence: docs/evidence/storage-dur-2026-08-22.md."
surveyed_not_changed = "A stale flush landing after this instance's OWN terminal write still truncates the row back to its snapshot. Fencing at decision time rather than write time would close it, but the rejection cannot then be told apart from a foreign writer without more state, and it is not conversion-introduced. `setValidationRunStatus` now has ZERO production callers and stays as a test fixture setter, documented as one."
affects = []

[[node]]
id = "obs.recorder-state-is-not-a-boolean"
critical = true
depends_on = ["s7.flight-recorder-onto-the-port"]
role = "createFlightRecorder returns NoopFlightRecorder from TWO situations, config disablement and a failed open, and NoopFlightRecorder returns a successful empty result for every read. So a corrupt or unreadable logs.db presents to llm_process_health as `LLM_GATEWAY_LOGS_DB=none` and to doctor as normal zero-valued cache data. That is the silent empty-success symptom of the June 2026 logs.db corruption, still present. An async schema-bootstrap failure is a THIRD state again: it logs, and the real recorder object stays installed."
action = "Make the states nameable at the recorder and carry the name to the surfaces an operator reads. Add storage health to doctor --json, which reports none today, and extend setup/status.schema.json with it because that schema forbids unspecified fields."
constraint = "Degrading rather than crashing is DELIBERATE and stays. Only the visibility changes. The health read is a SYNCHRONOUS snapshot, so it must not report `active` for a recorder whose bootstrap has not settled. Every change gets a control that FAILS on the unchanged code, and the fault injection is a real truncated SQLite file and a real post-open read failure, never a stubbed flag. Never against ~/.llm-cli-gateway/logs.db."
status = "done 2026-08-22. FIVE states on the recorder itself (disabled, unavailable, initialising, degraded, active) and ONE function owning the operator sentence for each, so no surface authors its own claim about why history is missing; the two `instanceof NoopFlightRecorder` reads are gone. Carried to llm_process_health, health://status, metrics://process-health, the startup Storage: block and BOTH request-history read tools, whose hints named LLM_GATEWAY_LOGS_DB as the only cause an empty answer could have. doctor --json gains a storage block (state, file and WAL bytes, schema version, row counts, retention, co-resident tables) and setup/status.schema.json is extended for it at schema_version 1.1, required, with null meaning NOT MEASURED rather than zero; a corrupt recorder now sets ok=false. FOUR faults injected against real SQLite files: a truncated database and a garbage-header file both OPEN successfully and fail every operation, an unopenable path throws at construction, and a second writer dropping a table gives a read AND a write failure after a successful open. Two more outside the vitest process: RLIMIT_FSIZE gives `disk I/O error` and is in the suite gated on dist/, and a real 200k tmpfs gives ENOSPC. FOUND, and NOT fixed because it is outside this track's four files: on a genuinely full disk drivers/sqlite.ts:315 issues its own ROLLBACK after SQLite has already auto-rolled-back, and that rejection REPLACES the real `database or disk is full`, so the one failure an operator most needs named is the one whose cause is destroyed. `initialising` proved reachable in an existing test rather than in theory. Six mutation controls, unmutated 16/0, each mutation red on exactly its own tests. Suite 4634 to 4643, 0 removed. Evidence: docs/evidence/storage-obs-2026-08-22.md."
affects = ["s11.retention"]
