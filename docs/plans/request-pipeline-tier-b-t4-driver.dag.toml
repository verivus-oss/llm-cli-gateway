[decision]
extraction_scope = "terminal envelope ONLY (the single try/catch/finally + execute dispatch + deferred/failure/success terminal choreography); the front half (states 0..8) stays per-handler and is NOT hidden behind a prepare callback"
driver_symbol = "runKitTerminalEnvelope<TFacts>(env: KitTerminalEnvelope, hooks: KitTerminalHooks<TFacts>): Promise<ExtendedToolResponse>"
outcome_type = "tagged union KitStageOutcome<T> = { ok:true; value:T } | { ok:false; earlyResponse:ExtendedToolResponse } (replaces the weak 'earlyResponse' in o discriminant all three reviewers flagged)"
topology_seam = "hooks.runInsideTerminalTry() runs WHAT the provider puts inside the envelope try; claude passes states 4..8 (so their failures reach the envelope catch + finally metric); codex passes a trivial passthrough returning the worktreeResolution it already computed OUTSIDE the try (so codex front-half failures never enter the envelope)"
manager_fields_are_per_context = "usageUpdateManager / failureRollbackManager / exceptionRollbackManager / fireRequestCleanupInCatch are context fields, NOT hard-coded; claude and codex deliberately target different session managers per call-site and the ledger already takes the manager as an argument"
kit_finalize_gate_centralised = "the driver owns the gate `kit && kitSession && !result.jobId` and calls finalizeKit only when it holds; a leaf can never forget it"
compute_success_facts_required = "computeSuccessFacts is a REQUIRED hook (not optional) so extract-before-finalize is type-enforced; codex extracts usage/cost/meta there BEFORE finalize (a parse throw leaves the Kit session un-finalized, as today); claude sets TFacts=undefined and implements it as a no-op () => undefined, parsing AFTER finalize inside buildSuccessResponse (finalize-before-parse, as today); making it required removes the unsound `undefined as TFacts` cast"
kit_job_handed_off_is_driver_local = "kitJobHandedOff is set inside the envelope and read only by the envelope catch; it is NOT a context field, preserving today's per-handler-local semantics"
h_double_complete_fence_preserved = "deferred transfers completion ownership to the manager BEFORE settle (T3 fence); the catch completeInline is a no-op once transferred; no path writes two inline completions"
invoked_log_is_provider_owned = "the 'invoked with ...' log is written by each provider inside its own state-8 code (claude AFTER flight.start, ~10409..10411); the driver never logs it"
single_pr_no_deferral = "one PR: driver + both handler rewrites + all boundary tests + spec amendment; no provider, edge case, or test deferred"
reason = """
Three independent adversarial reviews unanimously rejected a generic 0..12
replay driver because the two handlers do not share a try/finally topology, and
a shared one silently changes codex's metric/cleanup/rollback boundary. What IS
genuinely shared and worth de-duplicating is the terminal envelope: both
handlers implement the exact same ledger+flight call order and gating (including
the H-DoubleComplete fence) around execute. Extracting only that, with a
runInsideTerminalTry seam for the topology difference, de-duplicates the shared
choreography while preserving every provider-specific boundary byte-for-byte.
The front half is genuinely divergent (opposite prep-vs-kitSession ordering,
mint-vs-empty effectiveSessionId, claude-only MCP plumbing, opposite try
scopes); hiding it behind a callback would relocate ~300-400 lines per provider
without de-duplicating them, for worse stack traces and a read-top-to-bottom
penalty. So it stays inline per handler.
"""

