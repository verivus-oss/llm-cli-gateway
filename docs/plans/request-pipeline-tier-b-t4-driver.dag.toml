A single generic `runKitTerminalEnvelope` driver owns exactly ONE
try/catch/finally (the execute dispatch + the deferred/failure/success terminal
choreography + the catch + the finally metric), with a `runInsideTerminalTry`
seam; BOTH `handleClaudeRequest` and `handleCodexRequest` build an `env` +
`hooks` and return `runKitTerminalEnvelope(env, hooks)`; every path for both
providers is byte-behaviour-preserving per the design's section-4 preservation
matrix (exactly-once metric, fenced flight completion, no dropped/double
cleanup, preserved manager asymmetry, centralised finalize gate, preserved
success-facts/finalize order, unchanged principal isolation); every state 4..8
failure path has its OWN explicit test for BOTH providers plus a codex
facts-order-throw test; the Tier-B spec's "replays states 0..12" wording is
amended to "owns the terminal envelope"; and `npm run check` is green.
"""
invariant_sources = [
  "docs/plans/request-pipeline-tier-b-t4-driver.design.md",
  "docs/plans/request-pipeline-tier-b-handler-envelope.spec.md",
  "src/index.ts",
