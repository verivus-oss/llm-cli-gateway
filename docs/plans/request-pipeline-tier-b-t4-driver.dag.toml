  - `interface KitTerminalHooks<TFacts = undefined>` with runInsideTerminalTry,
    execute, decorateDeferred? (optional), computeSuccessFacts (REQUIRED),
    finalizeKit, buildFailureResponse, buildSuccessResponse - exact signatures per
    design 2.3.
  - `async function runKitTerminalEnvelope<TFacts>(env, hooks)` - the driver body
    exactly as design 2.4: try { runInsideTerminalTry (ok:false -> return
    earlyResponse); execute; set kitJobHandedOff; deferred branch (transfer BEFORE
