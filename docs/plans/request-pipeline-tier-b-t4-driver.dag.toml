# Implementation plan: Tier-B T4 - the terminal-envelope driver.
#
# Goal: extract the ONE genuinely shared piece of the two sync Kit request
# handlers - the terminal envelope (the request's single try/catch/finally, the
# execute dispatch, and the deferred/failure/success terminal choreography) -
# into a generic `runKitTerminalEnvelope` driver, and rewrite BOTH
# `handleClaudeRequest` and `handleCodexRequest` to build an `env` + `hooks` and
# call it. Byte-behaviour-preserving for both providers across every path. One
# PR: driver + both handler rewrites + full per-path test coverage + the spec
# amendment. Nothing deferred to a follow-up.
#
# Context:
#   The coordinated design is docs/plans/request-pipeline-tier-b-t4-driver.design.md
#   (rev 3, unconditionally approved by Codex gpt-5.5, Grok 4.5, and Mistral).
#   It SUPERSEDES the one-line T4 framing in the Tier-B spec
#   (docs/plans/request-pipeline-tier-b-handler-envelope.spec.md, section 5/7:
#   "the driver replays states 0..12"). The design's load-bearing correction,
#   verified in code by all three reviewers:
#
#     1. The two handlers have DIFFERENT try/finally topologies. Claude wraps
#        states 4..12 in ONE try/catch/finally (a state 4..8 throw reaches the
#        terminal catch AND the finally records a performance metric). Codex runs
#        states 4..8 OUTSIDE its main try, each with its OWN dedicated
#        early-return catch and NO metric; its try wraps only states 9..12.
#     2. A single shared try/finally over states 4..12 (the rejected scaffold)
#        would force Claude's topology onto Codex: a codex front-half failure
#        would newly run a metric-recording finally and could drop
#        `requestCleanup` / use the wrong rollback manager. That is a real
#        behaviour change, not a doc nit. The rejected scaffold has already been
#        reverted from src/index.ts (verified: 0 matches for the driver symbols).
#     3. Codex's three front-half catches are NOT uniform: worktree-resolve and
#        argv-admission do cleanup+discard with NO rollback; only
#        session-admission/materialize does `rollbackOnFailure(kitSession,
#        runtime.sessionManager)`. All three record NO metric.
#
#   So the extraction is the terminal envelope only, with a `runInsideTerminalTry`
#   seam that lets Claude keep states 4..8 INSIDE the envelope try (preserving its
#   metric-on-error boundary) and Codex keep states 4..8 OUTSIDE in its own
#   dedicated catches (preserving its no-metric boundary). This DAG is a
#   single-PR decomposition of that design; it is NOT a multi-phase release.
#
#   `RequestTerminalLedger` and `FlightOwnership` already exist in src/index.ts
#   (extracted by T2 / T3); the H-DoubleComplete fence (transfer-before-settle)
#   is T3 and must stay intact. This is the last Tier-B slice stacked on
#   master e94ae13 (post T0/T0.5/T0.1/T1/T2/T3, all merged).

