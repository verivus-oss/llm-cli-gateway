"""
idempotent = true
validation = """
`npm run check` is green (or every locally-available gate is green with any
unavailable optional-service gap documented). The verification notes list exact
commands, results, and before/after test counts.
"""

[[steps]]
id = "cross-llm-review-gate"
depends_on = ["verification-gate"]
actor = "assistant"
action = """
Run the adversarial cross-LLM review gate on the implemented gemini diff (Codex +
Grok + Mistral, inspected-evidence only, fresh sessions, absolute paths in-prompt,
no workingDir/workspace fields). Give each: the T5 design, this DAG, the
verification notes, and the exact gemini diff (git diff master -- src/index.ts +
the new test). Reviewers verify D1 (kit=null inertness / byte-preservation), D2
(the H-DoubleComplete fence is correct + its reachability is pinned), and D3 (the
gemini divergences and the manager collapse are preserved) against the real
handler and the driver. Poll ~every 90s; read Codex's full verdict via
llm_request_result. Iterate to UNCONDITIONAL approval from all three, or a concrete
unresolvable blocker. Never give a same-repo claude_request reviewer write access.
"""
idempotent = true
validation = """
The verification notes record each reviewer's dispatch id, every round's findings
and the code/doc-evidenced response or fix, and a final UNCONDITIONAL approval from
Codex, Grok, and Mistral (or a concrete documented blocker). D1/D2/D3 are each
explicitly ratified against inspected code.
"""

[[steps]]
id = "open-pr"
depends_on = ["cross-llm-review-gate"]
actor = "assistant"
action = """
Open ONE PR from the T5a branch to master via werner_veriai (gh-as/git-as; PR +
checks, never admin bypass; --merge not --squash on the internal repo). The PR
contains the gemini handler rewrite + the gemini-handler-terminal-net. Title and
body: no em dash, no Co-Authored-By trailer, match repo commit style. Body
summarises the non-Kit envelope routing (kit=null), the deliberate H-DoubleComplete
fence, and links the T5 design + verification notes. Note this is the first of five
T5 slices (grok, devin, mistral, cursor follow, each its own PR citing the T5 design).
"""
idempotent = false
validation = """
The PR is open against master with the gemini rewrite + net, green required checks,
and a body citing the T5 design and verification notes. No admin bypass. Commit/PR
text is em-dash-free with no attribution trailer.
"""

[rollback]
guidance = """
Pure internal refactor of one handler: byte-behaviour-preserving except the
intended H-DoubleComplete fence. To revert, restore handleGeminiRequest's inline
terminal try/catch/finally from the base commit and drop the new terminal net; the
shared driver/ledger/flight (used by claude/codex) are untouched. No schema,
resource, or release-surface change. If any reviewer holds that the H-DoubleComplete
fence must NOT ship for gemini (e.g. a proven behaviour regression), that is a
design-level blocker (D2) to resolve before coding, not a rollback.
"""
