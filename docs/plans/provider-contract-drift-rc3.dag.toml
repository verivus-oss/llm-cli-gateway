[decision.auto_declare_scope]
decided_on = "2026-08-13"
rule = "default_on_with_explicit_per_provider_opt_out_and_conservative_safety"
reason = """
Four findings drove this, three of them from the failed blanket attempt.

DEFAULT ON, BOTH REGISTRIES. Cataloguing alone leaves a command visible to drift
detection but unreachable, which is the state the principle rejects: the gateway
wires up access to capability as it appears. Opt-in would leave new capability
unwired until somebody noticed, recreating exactly the manual toil this
automation exists to remove. The blanket attempt's failure was overriding a
decision, not acting automatically.

EXPLICIT PER-PROVIDER OPT-OUT. The one real breakage was the deliberately empty
Vibe subcommand tree. A probe sees that `vibe mcp` exists; it cannot see that
somebody decided the tree stays empty. The fix is not a better heuristic, it is
that intent must be DECLARED rather than inferred, in the data, where the tool
trips over it. This repo already works this way: `REAL_INSTALLED` says
"deliberately NOT derived", and the agy ACP assertion says "deliberately a
literal ... so the claim is re-probed rather than restamped".

CONSERVATIVE SAFETY, NEVER read-only. The two misclassifications are not
symmetric. Calling a read-only command gated costs an approval prompt on a
harmless query. Calling a destructive command read-only removes a control. Only
the second is a safety failure, so the generator always picks "mutating-gated",
which maps through the existing policy to mcp_requires_approval: reachable, argv
passed straight through to the binary, every call gated. Relaxing an entry needs
evidence, and that direction requires a human.

EVIDENCE MUST CITE THE PROBE. Every hand-written adminSubcommands entry carries
a citation. A generated one must too, or the registry starts holding claims
nobody made.
"""
rejected_alternatives = """
INFER SAFETY FROM HELP TEXT. `bedrock configure` mentions "credentials", so a
heuristic could guess mutating. That is the gateway interpreting provider
semantics, which the governing principle rules out, and conservative-by-default
needs no interpretation to be safe.

DECLARE ONLY WHAT THE CONTRACT ALREADY CATALOGUES. Sounds safer, but it makes
reachability depend on cataloguing order, which is the same order-dependence bug
already fixed once in this work: cataloguing removes a command from
rootCatalogDrift, so the second pass goes blind.
"""
mistral_premise_expired = """
AMENDMENT 2026-08-13, found while implementing. The decision above assumed the
empty Vibe subcommand tree was deliberate policy the probe could not see, and
that mistral therefore needed `autoDeclare = "off"`. Checking it showed
otherwise.

`upstream-contracts.test.ts:305` asserts the empty tree with no rationale at the
assertion. The reasoning lives in `provider-definitions.ts`, and it is FACTUAL,
not a policy: "The ONLY real vibe CLI admin surface is two top-level FLAGS
(vibe --help advertises no subcommands)."

That was true when written. It is not true of vibe 2.24.1, which advertises
`vibe mcp` with `add` and `remove` children (probed directly). So the empty tree
is now a stale claim about upstream, not an intent to preserve, and pinning
mistral to "off" would freeze an expired premise and permanently hide a real
capability.

Correct action: let auto-declaration record `mcp`, update the assertion, and fix
the stale comment to describe what vibe now advertises.

The `autoDeclare` field is still added and still defaults to "reachable". The
opt-out remains the right mechanism for genuine intent; this simply is not a
case of it. Nothing currently needs "off", and inventing a user for it would be
worse than leaving it unused.

Worth noting the process point: the DAG is what forced this. Writing "set
mistral to off, citing the deliberate empty tree" made the assumption explicit
enough to check, and it did not survive checking.
"""
non_failure_note = """
Worth recording so the safety model is not blamed for a scope error: blanket
declaration never created an unsafe surface. Of 46 families, the policy left 23
not_exposed (starts_server / updates_binary / executes_agent) and gated 61 of
the rest. The failures were scope and overridden intent.
"""

[[steps]]
id = "devin-flag-removal"
depends_on = ["preserve-target-spelling"]
actor = "assistant"
status = "done"
action = """
Upstream dropped `--agent-config` and the `shell` command from devin
3000.4.16, while the gateway still emits the flag at `index.ts:13029`. This is
the one class the rebaseliner deliberately refuses, because `flags` is the argv
emit allowlist. Coordinated edit required across:
  1. src/upstream-contracts.ts  (contract `flags` + the devin-agent-config fixture)
  2. src/provider-codegen.ts    (generation table)
  3. src/index.ts               (argv emission at :13029, tool schemas at :18733 and :20910)
  4. src/__tests__/devin-argv-golden.test.ts
Confirmed unrelated to the Personal Agent Config Kit: devin's `--agent-config`
is a CLI flag for a config FILE; the Kit's `~/.agent-config` is its baseline
DIRECTORY, and `personal-config.ts` has zero references to `agentConfig`.
"""
idempotent = false
validation = "`npm run upstream:drift` exits 0; `npm test` is green."

[[steps]]
id = "verdaccio-min-release-age"
depends_on = ["scope-reachability"]
actor = "assistant"
status = "done"
action = """
`scripts/verify-registry-install.sh` fails its fresh-consumer install with:

  npm error notarget No matching version found for llm-cli-gateway@3.1.0-rc.3
    with a date before 8/10/2026, 10:39:20 PM.

Cause: this host's `~/.npmrc` sets `min-release-age=3`, a supply-chain control
that refuses any package published in the last three days. The check publishes
to an EPHEMERAL LOCAL verdaccio and installs seconds later, so the package it is
verifying can never satisfy that floor. Today minus three days is exactly the
reported cutoff.

Pin `min-release-age=0` for the verdaccio consumer install only. The control is
about the PUBLIC registry, where an attacker-published version is the threat; a
tarball this script just built and published locally has no such exposure, and
the floor would otherwise make the release gate unrunnable on any host that sets
it. Do NOT relax the setting globally, and do not remove it from ~/.npmrc.
"""
idempotent = true
validation = """
`bash scripts/verify-registry-install.sh` completes; `bash
scripts/pre-release.sh` proceeds past the registry-fidelity step. A public-registry
install elsewhere still honours the operator's min-release-age.
"""

[[steps]]
id = "release-gate"
depends_on = ["devin-flag-removal"]
actor = "assistant"
status = "done"
action = """
Re-run `bash scripts/pre-release.sh` end to end, so the three steps the drift
failure has been masking finally execute: `npm run check`, the Verdaccio
registry-fidelity install, and the tarball strip/verify.
"""
idempotent = true
validation = "pre-release.sh exits 0."
