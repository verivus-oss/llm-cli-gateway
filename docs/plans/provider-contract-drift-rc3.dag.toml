idempotent = true
validation = "Intended: drift falls and `npm test` stays green."
regression = """
BLANKET DECLARATION IS TOO AGGRESSIVE. It declared 46 families, i.e. every
discovered root command across all seven providers, and broke 9 tests:

  - `upstream-contracts.test.ts` asserts "an explicit empty Vibe tree". The
