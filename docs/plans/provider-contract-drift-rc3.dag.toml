# Implementation plan: clear provider contract drift for 3.1.0-rc.3, and close
# the automation gap that made the drift manual in the first place.
#
# Context. `scripts/pre-release.sh` fails at step 6 of 9 (`npm run
# upstream:drift`) with 35 critical findings, which blocks the release gate
# before `npm run check`, the registry-fidelity install, and the tarball verify
# ever run. The findings are host drift accumulated since rc.2, not a defect in
# the release candidate's own changes.
#
# Principle that shapes this plan (Werner, 2026-08-13): the gateway wires up
# access to provider capability, it does not replace or interpret it. New
# provider commands should become REACHABLE and pass through to the provider
# binary. Cataloguing a command in the contract silences drift detection but
# exposes nothing; reachability is a separate registry.
#
# Honest status note. Steps 1 to 5 were executed BEFORE this DAG existed, which
# inverted the required discipline and is why two regressions were found after
# the edit rather than before it. This file records that state truthfully rather
# than presenting the work as if it had been planned first. Steps 6 onward are
# planned before execution.

[meta]
name = "provider contract drift clearance for 3.1.0-rc.3"
schema_version = "1.1"
owner = "verivus-oss"
target_branch = "fix/pre-3.1.0-workingdir-and-skill-coverage"
release_candidate = "3.1.0-rc.3"
acceptance_resource = """
`npm run upstream:drift` exits 0; `npm test` is green; `bash scripts/pre-release.sh`
reaches and passes its `release gate` step; the working tree contains no
unintended edits.
"""
invariant_sources = [
  "scripts/pre-release.sh",
  "scripts/rebaseline-provider-contracts.mjs",
  "scripts/upstream-scan.mjs",
  "src/upstream-contracts.ts",
  "src/provider-definitions.ts",
  "src/provider-admin-tools.ts",
  ".agents/skills/provider-claude/SKILL.md",
]

[decision]
binary_policy = "stay_current"
binary_policy_reason = """
Provider CLIs are kept at latest rather than pinned. Contracts chase the tools;
the tools are not held back to suit the contracts. Upgrades go through
`cli_upgrade`, which uses each provider's native update mechanism.
"""
automation_expectation = """
Version drift, additive flag drift, and newly discovered commands are all
mechanical and belong in `providers:rebaseline`. Only a flag REMOVAL is manual,
because `flags` is the argv emit allowlist and a removal has to be made in
lock-step across the contract, `provider-codegen.ts` and `index.ts`.

SUPERSEDED 2026-08-14 by docs/plans/provider-contract-removal-autoapply.dag.toml.
The original wording is kept above because this file records what was believed
while the work was done, not what turned out to be right. The lock-step
observation held; the conclusion drawn from it did not. Requiring a human for a
removal made the gateway track a vendor's deprecation cycle by hand, and that
cycle is not ours to manage. All three edits are now made together by the tool.
"""
reachability_model = """
Two registries, both required, and they compose:
  - `upstream-contracts.ts` `subcommands` catalogues that a command exists, so
    drift detection is honest. This alone exposes nothing.
  - `provider-definitions.ts` `adminSubcommands` is what
    `projectProviderAdminOperations` reads, so it is what makes a command
    reachable.
`familyBaseRisk` prefers the contract's risk when declared and falls back to the
family's coarse `safety`. The single provider-agnostic policy
(`adminRiskToExposure`) then maps risk to exposure, so nobody hand-picks an
exposure: read_only -> mcp_readonly, writes_local_config/auth/network/destructive
-> mcp_requires_approval (reachable, approval-gated, argv passed through),
starts_server/updates_binary/executes_agent -> not_exposed.
"""

[[steps]]
id = "upgrade-provider-binaries"
depends_on = []
actor = "assistant"
status = "done"
action = """
Bring every provider CLI to latest via the gateway's own tool, so the contract
is rebaselined against a known-current state rather than a moving target:

  mcp__gtwy__cli_upgrade { cli: <each>, dryRun: false }

Note two host-specific hazards:
  - `claude update` fails against the root-owned global install. Use
    `sudo env "PATH=/opt/nodejs/current/bin:$PATH" /opt/nodejs/current/bin/npm
    install -g @anthropic-ai/claude-code@latest`.
  - `devin update` prompts interactively and returns 130 under a TTY. Run it
    with stdin closed; it exits 0 and reports nothing when already current.
"""
idempotent = true
validation = """
`mcp__gtwy__cli_versions` reports: claude 2.1.229, codex-cli 0.147.0,
gemini 1.1.12, grok 1.0.3, vibe 2.24.1, devin 3000.4.16, cursor 2026.08.11.
"""

[[steps]]
id = "rebaseline-versions"
depends_on = ["upgrade-provider-binaries"]
actor = "assistant"
status = "done_with_defect"
action = """
`npm run providers:rebaseline:apply` rewrites PROVIDER_TARGET_VERSIONS.
"""
idempotent = true
validation = "`npm run upstream:drift` reports no VERSION MISMATCH findings."
defect_found = """
CORRECTED 2026-08-13. There is NO version-format defect; this entry previously
claimed one and was wrong.

The first reading was that the tool writes the raw `--version` banner verbatim
and so broke `provider-version-guard` by changing the spelling of two targets
(`"claude 2.1.220"` -> `"2.1.229 (Claude Code)"`). That is not what happened.
`normalizeProviderVersion` already strips product prefixes, a leading `v`, and
parenthesised suffixes, so both spellings reduce to the same version and the
guard is indifferent to them.

What actually happened: `src/__tests__/provider-version-guard.test.ts` pins
`REAL_INSTALLED`, a frozen fixture of the exact strings this host reported on
2026-07-27. Its own comment says "Refresh this alongside `npm run
providers:rebaseline:apply`", and it is deliberately NOT derived from
PROVIDER_TARGET_VERSIONS, because deriving it would make the match assertions
tautological. Rebaselining the targets past that fixture is precisely the
"either a CLI moved or the normalizer broke" case the test exists to catch. A
CLI moved; seven of them did.

RE-CORRECTED, same day, after executing the fixture refresh. BOTH earlier
readings were partly wrong, and the truth is a combination:

  - The normalizer genuinely does not care about spelling, so the guard did not
    break for the reason first claimed. That part of the first correction holds.
  - BUT writing the raw banner verbatim DOES degrade the contract. The targets
    were curated (`claude 2.1.220`, `cursor-agent 2026.07.23-e383d2b`) and
    deliberately differ from the reported spellings (`2.1.220 (Claude Code)`,
    `2026.07.23-e383d2b`). That difference is the normalizer's whole reason to
    exist. Rebaselining to raw banners collapses it, and once the fixture is
    refreshed to the same raw strings, `naiveMismatches` is empty and the test
    "proves a naive equality check would have been wrong" becomes vacuous and
    fails.

So there IS a tool fix after all: the rebaseliner must preserve the target's
curated shape (its product prefix) rather than overwrite it with the banner.
Tracked as `preserve-target-spelling`.
"""

[[steps]]
id = "extend-tool-acknowledged-flags"
depends_on = ["rebaseline-versions"]
actor = "assistant"
status = "done"
action = """
`classifyRebaseline` classified additive drift and `main()` then discarded it:
only `versionUpdates` was ever written, despite the file header promising that
additive drift is safely rewritable. Nothing anywhere wrote
`acknowledgedUpstreamFlags`.

Implement the write path, root and subcommand level, using the TypeScript AST
for LOCATION ONLY and splicing text at the returned offsets. Never reprint a
node: the arrays carry per-entry trailing comments explaining why each flag is
not emitted, and a printer-based rewrite discards every one of them.
"""
idempotent = true
validation = """
Line-comment count in `src/upstream-contracts.ts` is unchanged (275 before, 275
after); `tsc --noEmit -p tsconfig.build.json` is clean; drift drops 31 -> 16.
"""

