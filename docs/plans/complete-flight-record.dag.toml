# Every request through the gateway records everything the provider did.
# Supersedes the scope of job-record-replayability.dag.toml, which it contains.

[meta]
surface = "what is launched, what is captured, what is projected back, and what retention keeps"
status = "c1 measured 2026-09-02, evidence in docs/evidence/c1-capture-ceiling-2026-09-02.md; c2 onward open"
issue = "https://github.com/verivusai-labs/llm-cli-gateway/issues/296"

# THE REQUIREMENT
#
# Every request to every agent tool records what went in, the exact argv, the
# reasoning, and the tool-use transcript. Today two of seven providers come
# close and five record only the final sentence.

[facts]
measured_at = "source read at 5aa45b2; per-provider stdout shapes and row counts are #296's measurements against one Postgres deployment on 3.2.0-rc.1"
capture_follows_the_caller = "output_format is a caller parameter and the gateway persists whatever wire the caller asked for. Nothing asks for the richest one, so what is recorded is a caller's display preference"
gemini_refusal_is_stale = "the gateway refuses gemini stream-json saying agy emits text only. agy 1.1.24 emits an init event with cwd and 57 tools, per-tool step_update events with parameters, and usage. The registry declares outputFormats text; the binary does not agree."
available_unused = "MEASURED. grok streaming-json, mistral streaming and cursor stream-json all carry tool calls and reasoning PROSE, in wires the gateway already accepts as outputFormat values and never selects. devin has no --format at 3000.6.11; it has --export."
devin_export_is_the_outlier = "devin --export writes an ATIF-v1.7 document, 92 KB against 23 bytes of stdout for a one-line task, carrying the system prompt, tool definitions, token totals AND the instruction files in force verbatim by path. devin_request_async already exposes it as exportSession and nothing sets it."
size_is_already_large = "codex event streams median 362 KB per job today, and executor.ts caps process output at 50 MB"
retention_would_eat_it = "RETENTION_SUBSYSTEMS bounds jobs at 30 days and leaves requests unbounded, so the complete record is the one that is swept"

[non_goals]
no_silent_launch_change = "a provider launched in a different wire returns different bytes. The caller's requested format is a PROJECTION of the captured one, never a thing the capture quietly overwrites."
no_claimed_reasoning = "a provider that emits no reasoning must record that it emitted none. Storing an empty field that reads like a complete record is worse than storing nothing."
no_unbounded_write = "capture has a ceiling and the ceiling is recorded when it is hit. A truncated transcript that does not say it was truncated is a false record."
no_new_disclosure_by_default = "a full transcript contains file contents the agent read. Whatever a remote HTTP caller could read before, it reads no more of after."

[[node]]
id = "c1.measure-the-ceiling"
critical = true
depends_on = []
role = "Every later node assumes a provider can emit a transcript. Five of seven are unmeasured, and the contract advertising a flag is not evidence the flag carries tool calls."
action = "DONE 2026-09-02. Table in docs/evidence/c1-capture-ceiling-2026-09-02.md, dispatched through the stdio gtwy and read back with llm_job_result rawOutput."
constraint = "This is a LIVE probe against installed binaries and belongs with upstream:drift, not with npm run check, which never touches a provider binary. Record the version probed beside every row."
constraint_2 = "Two further findings the node did not anticipate. The session id is ON THE WIRE for mistral and cursor and is not extracted, which is #296 defect 2 and the cause of the parseVibeMetaJson dead end. And job-progress.ts reports activity_only for cursor, mistral and devin while they emit a structured stream, so the richer wire buys nothing there until it knows the format."
affects = ["c2.capture-is-not-the-caller-projection", "c3.native-store-harvest"]

[[node]]
id = "c2.capture-is-not-the-caller-projection"
critical = true
depends_on = ["c1.measure-the-ceiling"]
role = "The single structural change. What is recorded and what is returned are the same string today, so a caller asking for text destroys the record."
action = "Launch in the richest wire c1 proved for that provider. Persist the raw stream. Derive the caller's requested output_format from it at return time."
constraint = "Every provider needs a rich-to-text and rich-to-json projection, and each one is a place a caller's output silently changes. Pin the projections against the current text output per provider before switching the launch wire."
constraint_2 = "Record the wire that was captured on the job row. Reading a stream without knowing which grammar it is in is not reading it."
affects = ["c4.bounded-and-honest", "c5.retention-follows-information", "c6.reachable-and-scoped"]

[[node]]
id = "c3.native-store-harvest"
depends_on = ["c1.measure-the-ceiling"]
role = "For a provider whose stdout will never carry the transcript, the transcript still exists: on disk, in the provider's own session store."
action = "After a job terminates, copy the provider's native session artefact for that run into the durable record. Precedent exists in the mistral Kit path, which already binds a gateway-owned session directory."
constraint = "The join must be KEYED. #296 found grok's summary.json request_id matches nothing on the gateway side and gemini reaches the store with no session key at all, so today the only join is directory plus start time. Under a neutral cwd that join is worthless."
constraint_2 = "Harvesting reads a file the provider wrote. Treat it as untrusted input on the way in, exactly as review-prompt.ts fences repository evidence."
affects = ["c4.bounded-and-honest", "c6.reachable-and-scoped"]

[[node]]
id = "c4.bounded-and-honest"
critical = true
depends_on = ["c2.capture-is-not-the-caller-projection", "c3.native-store-harvest"]
role = "Complete capture multiplies durable volume by the size of a transcript. A ceiling that is hit silently converts a complete record into a plausible partial one."
action = "One ceiling per job, recorded on the row with the byte count that was dropped and where. output_truncated already exists and is FALSE on all 3,620 jobs measured, which is a claim this node has to keep true or replace."
constraint = "Distinguish three states and never merge them: captured whole, captured to a stated ceiling, and not captured because this provider cannot emit it. The third is c1's finding made durable."
affects = ["c5.retention-follows-information"]

[[node]]
id = "c5.retention-follows-information"
depends_on = ["c4.bounded-and-honest"]
role = "Keeping everything and deleting it in 30 days is the current default, and it is the opposite of the requirement."
action = "Take the retention decision for jobs and requests together, with #287. The doctor warning added under job-record-replayability r5 fires once a request has outlived the job bound; it is a report, not the decision."
constraint = "Neither default moves without an explicit decision: changing either deletes or retains data on every installed host."
affects = []

[[node]]
id = "c6.reachable-and-scoped"
critical = true
depends_on = ["c2.capture-is-not-the-caller-projection", "c3.native-store-harvest"]
role = "A complete record nothing can read is a complete record nobody has. A complete record everyone can read is a disclosure."
action = "Project the captured transcript through llm_job_result and llm_request_result under the existing ownership checks, with an explicit remote-caller decision written beside the projection."
constraint = "A transcript carries file contents, absolute paths and possibly secrets the provider echoed. redactSecrets covers URL userinfo and password= assignments only, which is not a transcript-grade control. Decide what is applied on the way OUT and pin it."
affects = []

[[node]]
id = "c2a.the-record-must-not-cost-dedup"
depends_on = []
status = "done"
role = "Capturing more per request added a request-local path to argv. Argv is the dedup identity, so the capture silently turned every devin request into a unique one."
action = "DONE. CliRequestPrep carries dedupArgs, computed where the path is minted, and the four sites that build devin argv consume it. A derived-set test fails when a fifth site does not."
constraint = "Found by cross-LLM review at adfaf88: the canonicalisation existed and was called at one of four sites. The helper itself had no test, and replacing its body with an identity function survived 4842."
constraint_2 = "A CALLER-supplied export path stays in the identity. Two requests writing to different destinations differ in an effect the caller can observe, so they are not the same request."
affects = ["c3.harvest-the-native-stores", "c4.bounded-and-honest"]
