idempotent = true
validation = "No shipped surface claims a guarantee the runtime does not have, in either direction."

[[steps]]
id = "round-1-review-repairs"
depends_on = ["reverse-the-documented-limitation"]
actor = "assistant"
status = """
done 2026-09-04. Two BLOCKERS, both real, neither an instrument artefact.
CODEX: cleanup removes the worktree before finalizing the record authorizing it,
and path and branch BOTH derive from the name, so a crash in that window let a
retry delete a live replacement. Fixed by a per-creation token in the worktree's
