"""
action = """
`*-pg` coverage for: successful cleanup finalizes; failed cleanup persists and
retries under a fresh manager; foreign-host deletion keeps the record and
touches no filesystem; database-side expiry preserves it; observer rejection is
reported; the same session id is recreated while a tombstone exists. Each test
