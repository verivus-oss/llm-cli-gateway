"""
idempotent = true
validation = "Both blockers have a control that fails without the repair; the review is re-dispatched at the new head."

[[steps]]
id = "round-4-review-repairs"
depends_on = ["round-1-review-repairs"]
actor = "assistant"
status = """
done 2026-09-05. Both seats rejected on the SAME blocker, found independently
and reproduced on real PostgreSQL: the token search failed closed on a failed
enumeration and failed OPEN one level in, so a listed worktree whose marker
