[[node]]
id = "gap.no_vacuum"
kind = "gap"
file = "src/sqlite-driver.ts"
line = 196
role = "CLOSED by s11, as an operator command rather than a timer: `llm-cli-gateway storage compact --yes`, with the gateway stopped, because VACUUM holds an exclusive lock for a full rewrite. doctor --json reports reclaimable_bytes so the decision has a number."
