role = "CLOSED by s11. README now says which subsystem each bound covers, that the two new ones default to OFF, and that deleting rows frees pages rather than bytes."
affects = []

[[node]]
id = "gap.no_storage_health"
kind = "gap"
file = "src/doctor.ts"
line = 488
role = "doctor reports backend and asyncJobsEnabled only. No file size, no row counts, no retention state, no wedged-run count. An operator gets no warning before 1.23 GB."
