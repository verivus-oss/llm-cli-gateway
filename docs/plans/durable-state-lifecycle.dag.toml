# ---------------------------------------------------------------------------
# INVARIANTS. These are review questions, not currently machine-checked.
# A table that cannot answer all five does not ship.
# ---------------------------------------------------------------------------

[[invariant]]
id = "every-durable-table-names-its-reaper"
question = "What deletes this row, and on what timer?"
holds_for = ["store.jobs", "store.flight_recorder", "store.validation_runs", "store.validation_run_jobs"]
fails_for = ["store.validation_receipts", "store.sessions_pg"]
why = "Was five of six with no answer. s11 answered three of those five with one policy. `validation_receipts` answers `immutable by design`, which the protocol accepts; `sessions_pg` is the one still answering nothing, and regression.session_ttl_lost is why."

[[invariant]]
id = "no-status-without-a-writer-to-terminal"
question = "For every non-terminal status, which code path writes a terminal one, and can it always run?"
holds_for = []
fails_for = ["leak.zero_seat", "leak.unminted"]
why = "'running' has exactly one exit, tryMint, driven only by caller tool calls. A run nobody reads is a row nobody finishes."

[[invariant]]
id = "response-and-durable-row-agree"
question = "Does the status returned to the caller match the status written to the store?"
holds_for = []
fails_for = ["leak.zero_seat"]
why = "startValidationRun computes not_started, returns it, and writes running, in one function."

[[invariant]]
id = "deleting-a-row-cascades-to-its-references"
question = "What else points at this row, and what happens to those pointers?"
holds_for = []
fails_for = ["leak.dangling_links"]
why = "validation_run_jobs has no REFERENCES clause in any of its three declaration sites."

[[invariant]]
id = "a-bound-that-existed-still-exists"
question = "Does this backend change remove a limit the previous backend enforced?"
holds_for = []
fails_for = ["regression.session_ttl_lost"]
why = "The 3.1.0 session cutover dropped a 30-day TTL and no release note says so. This is the invariant that would have caught it at review."

# ---------------------------------------------------------------------------
# CHANGE PROTOCOL.
# ---------------------------------------------------------------------------

[protocol]
before_adding_a_durable_table = """
Answer `every-durable-table-names-its-reaper` in the PR description. "Immutable
by design" is a valid answer; "not yet" is not, because the four unbounded
tables in this map were each introduced with "not yet" and none was revisited.
If it is genuinely unbounded, say so in README under Persistence, which today
says nothing about any of them.
"""

before_adding_a_status_value = """
Name the code path that writes the terminal value and say whether it can always
run. If the only writer is a caller-initiated tool call, the status leaks the
moment a caller walks away. That is Cause 2, 83 rows.
"""

before_changing_a_storage_backend = """
List the limits the OLD backend enforced and confirm each is preserved. The
3.1.0 session cutover passed review because everyone compared features, and TTL
eviction is not a feature anyone lists. Grep the old implementation for
timers, TTLs and eviction before claiming parity.
"""

before_wiring_a_new_provider_launch = """
dispatchProviderJob's CLI branch passes no flight-recorder handoff. If you copy
it for a new launch path you inherit the telemetry hole. Pass
flightRecorderEntry, writeFlightStart, extractUsage and outputFormat, or state
in the PR why this path deliberately has no cost accounting.
"""
