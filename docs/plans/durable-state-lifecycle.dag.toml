# Durable-state lifecycle: what is written, what is bounded, what leaks
#
# WHY THIS EXISTS
# The gateway has four durable stores and exactly one of them is bounded. That
# was not a decision anybody made; it is what you get when retention is added to
# the subsystem that noticed it needed retention, and every later table is
# introduced by a different slice. Each of those slices was reviewed and
# approved. None of them was asked "what deletes this row".
#
# It surfaced from production, not from reading the code. On 2026-08-18 the
# shared Postgres store on the dev host held:
#
#   jobs                  3141 rows   BOUNDED  (retentionDays -> expires_at)
#   validation_runs        353 rows   unbounded, 97 wedged in status='running'
#   validation_run_jobs   1094 rows   unbounded, 207 pointing at deleted jobs
#   validation_receipts    n/a        unbounded by design, undocumented
#   sessions              1728 rows   unbounded, 82% never reused after creation
#   logs.db (requests)    1.23 GB     unbounded, no retention, no VACUUM
#
# The 97 wedged runs are the load-bearing observation. They are not slow, not
# in flight, and not recoverable. 0 of 257 finalized runs have zero seats, so a
# zero-seat run has never once reached a terminal state.
#
# HOW TO USE IT
# Before adding a durable table, or changing who writes a status, find the node
# and follow `affects`. The `invariants` are the questions a reviewer must be
# able to answer; a table that cannot answer `reaped_by` does not ship.
#
# EVIDENCE
# Snapshot: docs/evidence/durable-state-2026-08-18.md (internal, not mirrored)
# Reproduction of the zero-seat leak is two MCP calls and is recorded there.

[meta]
surface = "durable state lifecycle: retention, finalization, telemetry capture"
branch = "unassigned"
last_reviewed_head = "801950d"
generated_from = "live Postgres + logs.db measurement on workhorse3, cross-checked against source"
measured_at = "2026-08-18"
node_count = 16
invariant_count = 5

# ---------------------------------------------------------------------------
# THE STORES. One is bounded. The boundedness is the property to check.
# ---------------------------------------------------------------------------

[[node]]
id = "store.jobs"
kind = "durable_table"
file = "src/job-store.ts"
line = 1322
role = "The ONLY bounded store. `retentionDays` sets `expires_at`; `evictExpired` deletes on a 5-minute timer. Every other table in this map was modelled on this one and inherited none of it."
reaped_by = "evictExpired (src/job-store.ts:1322, src/postgres-job-store-worker.ts:1093)"
affects = ["store.validation_run_jobs", "store.validation_runs", "leak.dangling_links"]

[[node]]
id = "store.validation_runs"
kind = "durable_table"
file = "src/job-store.ts"
line = 1106
role = "Unbounded until s11. No reaper, no retention, no cascade. 97 of 353 live rows were wedged at 'running' with nothing able to move them."
reaped_by = "s11: evictWedgedValidationRuns, OPT-IN via [persistence.retention].wedgedValidationRuns, default OFF. WEDGED and not merely slow: not finalized, past the horizon, and no link row pointing at a surviving job. A finalized run is NEVER reaped, so no receipt is orphaned."
affects = ["leak.zero_seat", "leak.unminted", "leak.dangling_links"]
critical = true

[[node]]
id = "store.validation_run_jobs"
kind = "durable_table"
file = "src/job-store.ts"
line = 1124
role = "Uncascaded from JOBS still: declared with no REFERENCES clause in all three declaration sites, so job retention orphans link rows silently. 207 of 1094 live rows point at deleted jobs."
reaped_by = "s11, from the RUN side only: evictWedgedValidationRuns deletes a wedged run's link rows in the same transaction. The jobs-side orphaning is unchanged and is what MAKES a run wedged."
affects = ["leak.unminted"]
note = "Job ids are randomUUID, so a stale primary key cannot be re-bound. The dead rows are weight, not a correctness hazard. The uncoordinated jobs DELETE is the fault."

[[node]]
id = "store.validation_receipts"
kind = "durable_table"
file = "src/job-store.ts"
line = 1130
role = "Unbounded, and deliberately immutable. That is defensible; the absence of any user-facing statement that it grows forever is not."
reaped_by = "NOTHING (by design)"
affects = []

[[node]]
id = "store.sessions_pg"
kind = "durable_table"
file = "src/session-manager-pg.ts"
line = 1
role = "Unbounded. The file backend has a 30-day TTL; the Postgres backend has none, and 3.1.0 moved sessions onto the [persistence] selector."
reaped_by = "NOTHING"
affects = ["regression.session_ttl_lost"]
critical = true

[[node]]
id = "store.flight_recorder"
kind = "durable_table"
file = "src/flight-recorder.ts"
line = 1
role = "Unbounded by default still, and now boundable. Stores full prompt and response bodies. Measured at 1.23 GB."
reaped_by = "s11: evictExpiredRequests, OPT-IN via [persistence.retention].requests, default OFF because deleting a year of transcripts on upgrade is not a default anyone chose. gateway_metadata goes with the request row; the foreign key requires that order."
affects = ["gap.retention_scope_misread"]

# ---------------------------------------------------------------------------
# THE LEAKS. Two distinct causes, established by decomposition, not by guess.
# ---------------------------------------------------------------------------

[[node]]
id = "leak.zero_seat"
kind = "defect"
file = "src/validation-orchestrator.ts"
line = 340
role = "CAUSE 1, 14 live rows. `deriveValidationRunStatus` computes the correct terminal status, `persistValidationRun` is then called WITHOUT it, and the writer hardcodes `args.initialStatus ?? \"running\"`. The tool response and the durable row disagree inside one function."
affects = ["store.validation_runs"]
critical = true
flow = [
  { file = "src/validation-orchestrator.ts", line = 340, token = "deriveValidationRunStatus", role = "correct status computed" },
  { file = "src/validation-report.ts", line = 127, token = "not_started", role = "returns not_started when nothing dispatched" },
  { file = "src/validation-orchestrator.ts", line = 349, token = "persistValidationRun", role = "called WITHOUT the computed status" },
  { file = "src/validation-orchestrator.ts", line = 915, token = "initialStatus ?? \"running\"", role = "hardcodes running; only startReviewRun supplies initialStatus" },
]
note = """
Not caller negligence. Every seat was terminally refused at admission, so no job
exists to poll and no seat can finish. `admission_failed` is already a modelled
terminal status, reached only from a THROW inside review admission; issues #270
and #271 deliberately converted refusals into `skipped` results, so no exception
ever reaches that catch. Affects every ask-path tool except compare_answers,
which is local-only.
"""

[[node]]
id = "leak.unminted"
kind = "defect"
file = "src/validation-receipt.ts"
line = 361
role = "CAUSE 2, 83 live rows. Seats ran and all reached terminal states, but finalization is caller-driven only. `tryMint` returns `unmintable` without writing any status, so the row stays 'running' forever."
affects = ["store.validation_runs"]
critical = true
note = """
"finalized" is written in exactly ONE place, src/validation-receipt.ts:456,
inside tryMint. tryMint has three drivers and all three are caller-initiated
MCP tool calls: the job_result eager hook, synthesize_validation, and
validation_receipt mint-on-read. dispatchProviderJob passes no onTerminal and
no onComplete, so the GATEWAY OBSERVES NOTHING. Note llm_job_result and
llm_request_result do NOT mint, so collecting output through the llm_* namespace
leaks the row by construction.
"""

[[node]]
id = "leak.dangling_links"
kind = "defect"
file = "src/job-store.ts"
line = 1866
role = "Job retention sets expires_at and evicts, with no cascade to validation_run_jobs. One-way: the run can never be minted afterwards, and no status is written, so it is permanently and irrecoverably 'running'."
affects = ["store.validation_run_jobs", "leak.unminted"]

[[node]]
id = "regression.session_ttl_lost"
kind = "regression"
file = "src/session-manager.ts"
line = 1837
role = "NEW IN 3.1.0. createSessionManager computes sessionTtlMs and passes it only on the file branch; the Postgres branch is `new PostgreSQLSessionManager(db.getPool())`. Upgrading a Postgres host silently removes an eviction bound that existed before."
affects = ["store.sessions_pg"]
critical = true
note = """
A reaper exists and is never called. `cleanup_expired_sessions(max_age_days)` is
defined in migrations/001 and migrations/009. Its only other appearances in the
whole repo are one code comment and one DAG line. No production code, script,
cron, or doctor path invokes it. src/session-manager-pg.ts:44 justifies a
timestamp fix by saying the function "sees a June session as minutes old and
never reaps it", which presupposes it runs. It does not. The timestamp fix was
still correct for ordering and most-recent resolution.
"""

# ---------------------------------------------------------------------------
# TELEMETRY CAPTURE. Separate from retention, same root question: who writes.
# ---------------------------------------------------------------------------

[[node]]
id = "gap.validation_seats_unrecorded"
kind = "defect"
file = "src/validation-orchestrator.ts"
line = 207
role = "The CLI seat branch calls startJobWithDedup with no flightRecorderEntry, no writeFlightStart, no extractUsage and no outputFormat. Zero flight-recorder rows exist for validation seats, all time, across 11502 rows."
affects = ["gap.no_readback", "gap.lcr_blind"]
note = """
The API branch DOES write (src/validation-orchestrator.ts:176), gated on
review !== true with a stated rationale. Only the CLI omission is unexplained:
no comment, no test, no DAG node. It reads as never-implemented rather than
decided. Prompts are NOT lost; they persist in async_jobs.args and, for reviews,
in payload_json with argv redacted. Latency and success rate are captured via
metrics.recordRequest. Only tokens and cost are missing.
"""

