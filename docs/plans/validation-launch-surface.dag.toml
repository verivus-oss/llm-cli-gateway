# Validation provider-launch surface: mechanical implication map
#
# WHY THIS EXISTS
# Four consecutive cross-model review rounds found the SAME defect: a rule was
# added to one caller and a second caller silently kept the old behaviour.
#
#   round 1  empty reviewer counted as agreement       (report path only)
#   round 2  the REVIEW judge still got empty seats    (second judge path)
#   round 3  the judge bypassed both launch gates      (second dispatch site)
#   round 4  the trust consent never reached the judge (second TOOL CALL)
#
# Every one was found by a reviewer, not by me, because I grepped what was in
# front of me instead of traversing the graph. Each instance sat one layer
# further out than the last: report -> judge -> dispatch -> tool boundary.
#
# HOW TO USE IT
# Before changing anything in this surface, find the node, then follow
# `affects` transitively to the leaves. Every node on that path is a place the
# change must be considered. `invariants` below are machine-checked; if one
# fails, the fix is to route the new caller through the existing path, NOT to
# copy the rule into the new site.
#
# Regenerate the edges with, from a checkout at this branch:
#   sqry index . && sqry graph callers <symbol>
# The counts in `invariants` are exactly what `sqry graph callers` reports.

[meta]
surface = "validation provider launch + cursor trust"
branch = "fix/270-cursor-trust-devin-sandbox"
commit = "8809125"
base = "5d87ef4"
sqry_index_commit = "8809125"
generated_from = "sqry graph callers, verified against git show"

