# ---------------------------------------------------------------------------
# MACHINE-CHECKED INVARIANTS. Counts are what `sqry graph callers` reports.
# src/__tests__/validation-single-launch-path.test.ts pins these.
# ---------------------------------------------------------------------------

[[invariant]]
symbol = "dispatchProviderJob"
callers = 1
expect = ["launchProviderSeat"]
why = "A second dispatch site is the exact defect of rounds 2, 3 and 4."
pinned_by = "validation-single-launch-path.test.ts"

[[invariant]]
symbol = "providerPreflight"
callers = 1
expect = ["launchProviderSeat"]
why = "A caller computing its own preflight can compute a permissive one."
pinned_by = "validation-single-launch-path.test.ts"

[[invariant]]
symbol = "reviewSandboxGap"
callers = 1
expect = ["providerPreflight"]
why = "Calling one gate directly means skipping the other."
pinned_by = "validation-single-launch-path.test.ts"

[[invariant]]
symbol = "cursorTrustGap"
callers = 1
expect = ["providerPreflight"]
why = "Same, and this one decides a security boundary."
pinned_by = "validation-single-launch-path.test.ts"

[[invariant]]
symbol = "buildProviderInvocation"
callers = 1
expect = ["dispatchProviderJob"]
why = "It is the function that actually emits --trust."
pinned_by = "validation-single-launch-path.test.ts"

[[invariant]]
symbol = "launchProviderSeat"
callers = 2
expect = ["startProviderJob", "startJudgeSynthesis"]
why = "Roster and judge. A third caller is fine; a caller that BYPASSES it is not."

# ---------------------------------------------------------------------------
# CHANGE PROTOCOL. What to traverse before editing.
# ---------------------------------------------------------------------------

[protocol]
before_changing_a_gate = """
Edit providerPreflight or a *Gap function only. Then run
`sqry graph callers providerPreflight` and confirm it is still 1. Every seat
inherits the change automatically; that is the point.
"""

before_adding_a_seat = """
Call launchProviderSeat. Do NOT call dispatchProviderJob. If the new seat
returns a different shape, map the SeatLaunch refusal in the caller, exactly as
startProviderJob and startJudgeSynthesis do.
"""

before_adding_caller_visible_policy = """
Ask: does the judge need it too? The judge runs in a LATER tool call
(synthesize_validation) and cannot see review_changes arguments. If both need
it, it belongs on ReviewRunAuthorization, which is durable, not on a tool
argument. This is the round-4 lesson.
"""

before_changing_the_trust_predicate = """
isProviderWorkspacePath is the whole automatic-trust boundary. Run
workspace-provider-grant.test.ts, which drives the REAL predicate with real
directories and symlinks. Injected fakes in the admission tests CANNOT catch a
grant-logic hole; that is how the nested-repo over-grant survived round 3.
"""
