name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Default to read-only on the GITHUB_TOKEN. Every job below either reads
# the working tree, builds, lints, or runs tests. None push commits,
# create issues, or write release artifacts. Future jobs that need write
# access should declare permissions at the job level rather than
# loosening this top-level default. Caught by zizmor (excessive-permissions).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ github.repository == 'verivus-oss/llm-cli-gateway' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","x86_64","workhorse3","gateway"]') }}
    # Job-level permissions match the workflow default explicitly (zizmor
    # flags ambiguous-inheritance otherwise).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      # ONE fence per job, not one per step. Node's tmpdir() is /tmp unless
      # TMPDIR says otherwise, and on the self-hosted host /tmp is a single
      # 8 GB tmpfs SHARED by twelve runner units; filling it has already failed
      # 220 unrelated suites. Rounds 4 and 6 each found steps that had been
      # written without the per-step `env:` block, which is the tell that a
      # per-step fence is a VIGILANCE rule: it holds only while every author
      # remembers it, and the next step added will not have it.
      #
      # $GITHUB_ENV applies to every LATER step in the job, so exporting once
      # here makes the property hold by DEFAULT and a new step inherits it.
      # RUNNER_TEMP rather than ${{ runner.temp }}: the `runner` context is not
      # available in a job-level `env:`, which round 4 shipped and actionlint
      # caught only after it had expanded to the empty string.
      - name: Keep temporary files off the shared /tmp
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Wipe the auth token from .git/config after checkout so it
          # cannot be picked up by later steps (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # Supply-chain gate runs BEFORE any dependency code executes. Previously
      # this only ran inside security:audit, after a script-enabled `npm ci`
      # had already run whatever the tree contained. --frozen scores the
      # committed package-lock.json alone: no install, no npm subprocess, no
      # node_modules, ~0.1s.
      #
      # --allow-missing-dist is needed precisely because this now runs first.
      # The scan's fetch-in-dist invariant fails closed on an absent dist/,
      # which at this point in the job cannot exist yet. The flag narrows that
      # one check to "dist may be absent"; a present dist/ is still walked. The
      # strict form runs later in this same job inside security:audit, after
      # the build, so the invariant is not weakened.
      - run: node scripts/supply-chain/dep-drift-scan.mjs --frozen --allow-missing-dist
      # npm 12 refuses lifecycle scripts unless package.json `allowScripts`
      # approves them by exact version, so a newly introduced dependency that
      # wants to run install-time code fails the build instead of executing it.
      # Only better-sqlite3 and fsevents declare install scripts today and both
      # are covered; npm12-install-policy below asserts that independently.
      # --no-audit keeps this step off the advisory endpoint: security:audit is
      # the real gate and runs below.
      - run: npx --yes npm@12.0.1 ci --strict-allow-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      # These write through Node's tmpdir(); the fence at the top of the job is
      # what keeps that off the shared /tmp.
      - run: npm run test:fuzz
      - run: npm run test:ci
      # security:audit gates on npm-shrinkwrap.json presence + parity; the
      # shrinkwrap is generated, never committed (it would break npm ci).
      - run: node scripts/make-prod-shrinkwrap.mjs
      - run: npm run security:audit

  pack-smoke-test:
    runs-on: ${{ github.repository == 'verivus-oss/llm-cli-gateway' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","x86_64","workhorse3","gateway"]') }}
    permissions:
      contents: read
    steps:
      # ONE fence per job, not one per step. Node's tmpdir() is /tmp unless
      # TMPDIR says otherwise, and on the self-hosted host /tmp is a single
      # 8 GB tmpfs SHARED by twelve runner units; filling it has already failed
      # 220 unrelated suites. Rounds 4 and 6 each found steps that had been
      # written without the per-step `env:` block, which is the tell that a
      # per-step fence is a VIGILANCE rule: it holds only while every author
      # remembers it, and the next step added will not have it.
      #
      # $GITHUB_ENV applies to every LATER step in the job, so exporting once
      # here makes the property hold by DEFAULT and a new step inherits it.
      # RUNNER_TEMP rather than ${{ runner.temp }}: the `runner` context is not
      # available in a job-level `env:`, which round 4 shipped and actionlint
      # caught only after it had expanded to the empty string.
      - name: Keep temporary files off the shared /tmp
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: "npm"
      # Same ordering as build-and-test: gate the committed lockfile before any
      # dependency code runs, then install under npm 12's script policy.
      # --allow-missing-dist for the same reason as above; see build-and-test.
      - run: node scripts/supply-chain/dep-drift-scan.mjs --frozen --allow-missing-dist
      - run: npx --yes npm@12.0.1 ci --strict-allow-scripts --no-audit --no-fund
      - run: npm run build
      # Now that dist/ exists, run the scan in its strict form. This job packs
      # the tarball, so the fetch-in-dist invariant belongs here rather than
      # only in build-and-test's security:audit, which never sees this job's
      # build output.
      - run: node scripts/supply-chain/dep-drift-scan.mjs --frozen
      # Generate the prod-only shrinkwrap so the packed contents match what
      # an actual publish ships (it is generated, never committed).
      - run: node scripts/make-prod-shrinkwrap.mjs
      - name: Verify npm pack contents
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          if grep -E '^npm notice [0-9]' pack-output.txt | grep -qE 'src/|node_modules/|__tests__'; then
            echo "ERROR: Unwanted files in npm tarball"
            exit 1
          fi
      - name: Verify server starts
        run: |
          # This step has never verified a startup, in either of its two prior
          # forms. The original `|| true` meant it could not fail at all. The
          # replacement asserted `timeout` returned 124 ("still running"), which
          # passed locally only because the server takes ~8s to reach ready and
          # the 5s window was cutting it off MID-START. On the runner it reaches
          # ready quickly, then does the correct thing for a stdio MCP server
          # reading /dev/null: logs "stdin EOF, shutting down gracefully" and
          # exits 0. So 124 was never the success condition.
          #
          # What actually distinguishes a healthy boot from a broken one is that
          # it REACHES READY and then exits cleanly. Assert both. A crash gives
          # a non-zero status; a hang is killed by timeout and also non-zero;
          # a process that exits 0 without ever serving fails the grep.
          set +e
          timeout 60 node dist/index.js < /dev/null > startup.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "ERROR: server exited with status ${status} (124 = hung past the timeout)."
            tail -40 startup.log
            exit 1
          fi
          if ! grep -q "MCP server connected and ready" startup.log; then
            echo "ERROR: server exited 0 but never reported readiness."
            tail -40 startup.log
            exit 1
          fi
          echo "Server startup smoke test passed (reached ready, then shut down cleanly)"

  postgres-tests:
    # The PostgreSQL suites, which `npm run check` does NOT run and which no
    # gate ran at all until this job existed. They stayed red on master for two
    # days across three defects (a bootstrap/migration schema divergence, a
    # stale assertion pinning pre-fence behaviour, and hand-maintained
    # migration lists broken by a new file) because nothing executed them.
    #
    # A separate job rather than a step in build-and-test: it needs a database
    # container, and a failure here should name the engine rather than be
    # buried in a 6-minute run of everything else.
    runs-on: ${{ github.repository == 'verivus-oss/llm-cli-gateway' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","x86_64","workhorse3","gateway"]') }}
    permissions:
      contents: read
    # The self-hosted path RESETS a shared database, so two concurrent runs
    # would drop the schema out from under each other. Only one runner serves
    # this repo today, which makes that safe by accident rather than by design;
    # this makes it explicit so adding a second runner cannot silently break it.
    # cancel-in-progress is false because cancelling mid-reset is how a fixture
    # gets left half-built.
    concurrency:
      group: postgres-fixture-${{ github.repository }}
      cancel-in-progress: false
    env:
      # Set ONLY off the public mirror. Where it is set, test-pg.sh talks to the
      # long-lived fixture and never invokes podman, which the runner unit's
      # RestrictNamespaces forbids anyway. Where it is empty, test-pg.sh starts
      # its own throwaway container, which is what ubuntu-latest can do.
      #
      # A FLAG, not the DSN. The fixture's host, port, database and credentials
      # are declared once in FIXTURE in scripts/pg-fixture.mjs; repeating them
      # here made a port change a four-file edit with nothing catching a miss.
      #
      # NOTE the inverted condition. GitHub's a && b || c is short-circuit and
      # '' is FALSY, so `cond && '' || '1'` yields '1' on BOTH branches.
      # The truthy branch must carry the value.
      PG_TEST_EXTERNAL: ${{ github.repository != 'verivus-oss/llm-cli-gateway' && '1' || '' }}
    steps:
      # ONE fence per job, not one per step. Node's tmpdir() is /tmp unless
      # TMPDIR says otherwise, and on the self-hosted host /tmp is a single
      # 8 GB tmpfs SHARED by twelve runner units; filling it has already failed
      # 220 unrelated suites. Rounds 4 and 6 each found steps that had been
      # written without the per-step `env:` block, which is the tell that a
      # per-step fence is a VIGILANCE rule: it holds only while every author
      # remembers it, and the next step added will not have it.
      #
      # $GITHUB_ENV applies to every LATER step in the job, so exporting once
      # here makes the property hold by DEFAULT and a new step inherits it.
      # RUNNER_TEMP rather than ${{ runner.temp }}: the `runner` context is not
      # available in a job-level `env:`, which round 4 shipped and actionlint
      # caught only after it had expanded to the empty string.
      - name: Keep temporary files off the shared /tmp
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: "npm"
      # Same ordering as build-and-test: the supply-chain gate scores the
      # committed lockfile BEFORE any dependency code is allowed to execute.
      - run: node scripts/supply-chain/dep-drift-scan.mjs --frozen --allow-missing-dist
      - run: npx --yes npm@12.0.1 ci --strict-allow-scripts --no-audit --no-fund
      # Two modes, one path. With TEST_DATABASE_URL set the script uses the
      # long-lived fixture; without it, it starts postgres:17-alpine itself. It
      # deliberately does NOT use compose: this runner has podman and no docker,
      # and `podman compose` fails with "looking up compose provider failed".
      # Both modes reset the fixture and apply migrations/ before vitest.
      # setup.ts puts the test config, sessions file and logs database under
      # Node's tmpdir(). The job's first step already pointed that at
      # RUNNER_TEMP; this step carried its own `env:` block until round 7, when
      # a per-step fence turned out to be a rule every author has to remember.
      - run: npm run test:pg

  npm12-install-policy:
    # build-and-test owns the full test suite and security audit. This job
    # isolates npm 12's clean-install lifecycle-script policy.
    runs-on: ${{ github.repository == 'verivus-oss/llm-cli-gateway' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","x86_64","workhorse3","gateway"]') }}
    permissions:
      contents: read
    steps:
      # ONE fence per job, not one per step. Node's tmpdir() is /tmp unless
      # TMPDIR says otherwise, and on the self-hosted host /tmp is a single
      # 8 GB tmpfs SHARED by twelve runner units; filling it has already failed
      # 220 unrelated suites. Rounds 4 and 6 each found steps that had been
      # written without the per-step `env:` block, which is the tell that a
      # per-step fence is a VIGILANCE rule: it holds only while every author
      # remembers it, and the next step added will not have it.
      #
      # $GITHUB_ENV applies to every LATER step in the job, so exporting once
      # here makes the property hold by DEFAULT and a new step inherits it.
      # RUNNER_TEMP rather than ${{ runner.temp }}: the `runner` context is not
      # available in a job-level `env:`, which round 4 shipped and actionlint
      # caught only after it had expanded to the empty string.
      - name: Keep temporary files off the shared /tmp
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      # npm 12 blocks lifecycle scripts unless package.json explicitly approves
      # them. The pinned better-sqlite3 approval is required only by legacy
      # SQLite migration and WAL compatibility tests. fsevents stays denied:
      # it is an optional Vite watcher optimization, not a test requirement.
      # A better-sqlite3 update must be explicitly re-reviewed and re-approved.
      # --no-audit is deliberate: build-and-test runs security:audit; this job
      # must isolate install-script policy failures from audit network noise.
      - name: Clean install with npm 12 script policy
        run: npx --yes npm@12.0.1 ci --strict-allow-scripts --no-audit --no-fund
      - name: Verify approved native test fixture
        run: ./node_modules/.bin/vitest run src/__tests__/flight-recorder.test.ts
      # Keep the platform-specific simulation separate from the Linux native
      # fixture above, so each policy assertion has a clear failure mode.
      - name: Verify macOS policy has no unreviewed lifecycle scripts
        run: npx --yes npm@12.0.1 ci --dry-run --strict-allow-scripts --os=darwin --no-audit --no-fund
