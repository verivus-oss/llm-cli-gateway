name: security

# Free-OSS security posture. This workflow runs in parallel to ci.yml on
# the same triggers and is the local equivalent of the GHAS feature set
# (secret scanning + dependency review) that isn't available on private
# free-plan orgs. The code-SAST half of GHAS (formerly CodeQL) now lives in
# sast.yml (opengrep + gosec + govulncheck).
#
# Coverage map (matches verivus-oss/agent-assurance's posture):
#   actionlint      — GHA workflow correctness (broken expressions,
#                     deprecated APIs, shell-injection in `run:`)
#   zizmor          — GHA workflow security (impostor-commit, unpinned
#                     uses, excessive permissions, ambiguous inheritance)
#   shellcheck      — shell-script correctness for scripts/*.sh and
#                     installer/*.sh
#   typos           — source-code spellchecker (catches typo'd MCP tool
#                     names / env-var names / config keys)
#   gitleaks        — secret leak detection in commits + working tree
#                     (replaces GHAS secret scanning)
#   osv-scanner     — CVEs in package-lock.json (npm) and hashed Python
#                     CI tool requirements.
#                     Complements Dependabot: catches transitive and
#                     advisory-DB-only entries Dependabot misses.
#   lychee          — link rot in README.md / CHANGELOG.md / docs/*
#   attribution     — rejects new Claude/Anthropic author or co-author
#                     trailers so GitHub contributor attribution stays human /
#                     project-owned.
#
# Every step is SHA-pinned where the tool ships a stable release; binary
# downloads include SHA256 verification. `continue-on-error: false` is
# the default but made explicit to document intent — any finding fails
# the workflow.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # workflow_dispatch lets a maintainer re-run the suite on demand
  # without pushing — useful when allowlisting a transient CVE or
  # verifying a tool upgrade.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: security (workflow + content + deps + secrets)
    runs-on: ${{ github.repository == 'verivus-oss/llm-cli-gateway' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","x86_64","workhorse3","gateway"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Drop the auth token from .git/config after checkout so it
          # cannot be picked up by tool installers (zizmor artipacked).
          persist-credentials: false

      - name: Set up Python (for zizmor)
        # GitHub-hosted only. setup-python resolves against a tool cache that a
        # self-hosted runner does not have, and there is no published build for
        # this host's distribution, so it fails with "version 3.12 with
        # architecture x64 was not found". The self-hosted runner uses its
        # system python3 instead; the requirements file is hash-pinned with a
        # wheel list that satisfies it (verified: a --require-hashes install of
        # requirements-security.txt succeeds under python 3.13 and yields the
        # pinned zizmor 1.26.1).
        if: github.repository == 'verivus-oss/llm-cli-gateway'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Go (for actionlint)
        # actionlint is distributed as a Go binary. Pinning to "stable"
        # keeps us on the same line as the language's release cadence
        # rather than freezing a minor version that drifts.
        # Deliberately NOT made conditional like the Python step above: Go
        # resolves fine on the self-hosted runner (its tool cache already holds
        # a go toolchain), and disabling a step that works would be guessing.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # ---------------------------------------------------------------
      # Workflow integrity — gate everything that follows.
      # ---------------------------------------------------------------

      - name: Workflow lint (actionlint)
        # Lints the workflow files themselves: broken `${{ }}` expressions,
        # invalid runner labels, deprecated event names, shell-injection
        # patterns in `run:` blocks. A bug here would silently break every
        # other security step.
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Workflow security audit (zizmor)
        # Catches GHA-specific security antipatterns: impostor-commit
        # (action SHA pin that doesn't actually point at the claimed
        # release), unpinned action references, excessive token scopes,
        # credential persistence through artifacts.
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_security_requirements.py requirements/ci/requirements-security.txt
          # Install into a venv rather than `pip install --user`. The system
          # python on the self-hosted runner ships without the pip module
          # ("No module named pip"), and venv bootstraps its own pip through
          # ensurepip. This works identically on a GitHub-hosted runner, so it
          # stays one code path rather than a conditional. The --require-hashes
          # supply-chain pin is unchanged, which is the whole point of
          # installing zizmor from a hash-pinned requirements file rather than
          # as a standalone binary.
          #
          # Scratch paths use $RUNNER_TEMP, never a fixed /tmp path. A
          # GitHub-hosted runner gets a fresh /tmp per job, so a hardcoded name
          # is harmless there; a self-hosted runner does not. /tmp persists
          # across jobs and is shared with every other user on the box, so a
          # leftover directory owned by someone else makes the step fail with
          # EACCES (observed: a stale werner-owned /tmp/zizmor-venv broke this
          # step for the `runners` user). $RUNNER_TEMP is per-job, owned by the
          # runner account, and cleaned between runs.
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes -r requirements/ci/requirements-security.txt
          # Default min-severity (low+); informational findings (job
          # names, concurrency limits, superfluous actions) are tracked
          # but not enforced, those don't move the security needle.
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" .github/workflows/

      # ---------------------------------------------------------------
      # Content correctness — cheap, broad coverage.
      # ---------------------------------------------------------------

      - name: Commit attribution policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] &&
             [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
            range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi

          git log --format='%H%n%an <%ae>%n%cn <%ce>%n%B%n---END---' "${range}" > "$RUNNER_TEMP/commit-attribution.txt"
          if grep -Ein \
            'Co-authored-by:[[:space:]]*Claude|<[^>]*@anthropic\.com>|noreply@anthropic\.com' \
            "$RUNNER_TEMP/commit-attribution.txt"; then
            echo "FAIL: commit attribution must not credit Claude/Anthropic accounts." >&2
            echo "Use human or project-owned author identity only; remove Claude/Anthropic co-author trailers before merging." >&2
            exit 1
          fi

      - name: Shell-script lint (shellcheck)
        # Our shell scripts run under release / install / pg-test flows;
        # correctness bugs here would silently break gates.
        #
        # Install a pinned binary rather than relying on the runner image.
        # ubuntu-latest pre-installs shellcheck, but the self-hosted runner does
        # not (the step failed with "shellcheck: command not found"), and an
        # image-provided version also drifts silently underneath us, which can
        # turn a green gate red with no repo change. Pinning makes the two
        # runner types behave identically and makes a lint-behaviour change an
        # explicit commit. Same approach as osv-scanner and gitleaks below.
        run: |
          set -euo pipefail
          VERSION="0.11.0"
          TARBALL="shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          # SHA256 fetched from the release artifact directly on 2026-07-28.
          # Update this pin when bumping VERSION above.
          EXPECTED_SHA="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/${TARBALL}" -o "$RUNNER_TEMP/${TARBALL}"
          actual=$(sha256sum "$RUNNER_TEMP/${TARBALL}" | awk '{print $1}')
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "FAIL: shellcheck tarball SHA256 mismatch."
            echo "  expected: ${EXPECTED_SHA}"
            echo "  actual:   ${actual}"
            exit 1
          fi
          tar -xJf "$RUNNER_TEMP/${TARBALL}" -C "$RUNNER_TEMP" --strip-components=1 \
            "shellcheck-v${VERSION}/shellcheck"
          "$RUNNER_TEMP/shellcheck" --version
          "$RUNNER_TEMP/shellcheck" \
            scripts/release-security-audit.sh \
            scripts/test-pg.sh \
            installer/build-release.sh

      - name: Source-code spellcheck (typos)
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      # ---------------------------------------------------------------
      # Secret + CVE scanning.
      # ---------------------------------------------------------------

      - name: Lock-file CVE scan (osv-scanner)
        # Install the official osv-scanner binary at a pinned version rather
        # than using osv-scanner-action. That action is a CONTAINER action, so
        # it requires a docker daemon; this repository's self-hosted runner has
        # podman and no docker, and a container action cannot use it. The
        # scanner itself is a single static Go executable with no such
        # requirement, which makes this job behave identically on a
        # GitHub-hosted and a self-hosted runner. Same reasoning as the gitleaks
        # step below.
        run: |
          set -euo pipefail
          VERSION="2.3.8"
          BINARY="osv-scanner_linux_amd64"
          # SHA256 of the published release artifact, fetched and verified on
          # 2026-07-28. Update this pin when bumping VERSION above.
          EXPECTED_SHA="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${VERSION}/${BINARY}" -o "$RUNNER_TEMP/osv-scanner"
          actual=$(sha256sum "$RUNNER_TEMP/osv-scanner" | awk '{print $1}')
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "FAIL: osv-scanner binary SHA256 mismatch."
            echo "  expected: ${EXPECTED_SHA}"
            echo "  actual:   ${actual}"
            exit 1
          fi
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # --no-resolve disables network-required transitive dependency
          # resolution. package-lock.json has full transitive info baked in,
          # and requirements/ci uses hash-pinned direct tool dependencies.
          "$RUNNER_TEMP/osv-scanner" scan \
            --recursive \
            --no-resolve \
            ./

      - name: Secret scan (gitleaks)
        # Install the official gitleaks binary at a pinned version (not
        # the gitleaks-action — the action requires an org license for
        # >25-member orgs and adds a Node.js dep we don't need). The
        # binary is a single static Go executable; the SHA256 below is
        # the published release checksum for the linux_x64 tarball.
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          # SHA256 fetched from the release artifact directly on
          # 2026-05-26. Update this pin when bumping the VERSION above.
          EXPECTED_SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}" -o "$RUNNER_TEMP/${TARBALL}"
          actual=$(sha256sum "$RUNNER_TEMP/${TARBALL}" | awk '{print $1}')
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "FAIL: gitleaks tarball SHA256 mismatch."
            echo "  expected: ${EXPECTED_SHA}"
            echo "  actual:   ${actual}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/${TARBALL}" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1

      # ---------------------------------------------------------------
      # Link rot — keeps the published docs (npmjs, GH
      # release notes) honest.
      # ---------------------------------------------------------------

      - name: Link-rot scan (lychee)
        # lychee checks every http(s):// URL in tracked markdown and
        # local site links in HTML. Root-relative site links such as
        # /install.md resolve against the Pages output directory.
        # Configured by lychee.toml at the repo root.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --root-dir '${{ github.workspace }}/site'
            './**/*.md'
            './**/*.html'
            './**/*.rst'
