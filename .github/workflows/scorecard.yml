name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 2"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Mint a SHORT-LIVED (1h), read-only App token so Scorecard's
      # Branch-Protection check can read the protection rules (the default
      # GITHUB_TOKEN cannot, which left that check at -1). Down-scoped to
      # administration+metadata read ONLY, even though the App can do more —
      # this is the org's standard pattern (see verivus-oss/sqry), and is far
      # safer than a long-lived PAT. Only the mirror holds MIRROR_APP_*; the
      # private dev repo skips this and Scorecard falls back to GITHUB_TOKEN.
      - name: Mint read-only App token (branch-protection read)
        id: app-token
        if: github.repository == 'verivus-oss/llm-cli-gateway'
        # Resilient: if the App can't mint a token (e.g. not yet installed on
        # this repo) the run still proceeds — repo_token is then empty and
        # Scorecard falls back to GITHUB_TOKEN (Branch-Protection reverts to -1
        # rather than failing the whole workflow). Self-heals once the App is
        # installed on the repo.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: verivus-oss
          repositories: llm-cli-gateway
          permission-administration: read
          permission-metadata: read

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Empty on the private repo (step skipped) -> action uses GITHUB_TOKEN.
          repo_token: ${{ steps.app-token.outputs.token }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
